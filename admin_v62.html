<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RAJA ELECTRONICS — Admin</title>
<!--
  ═══════════════════════════════════════════════════════════════════════════
  RAJA ELECTRONICS — ADMIN CONSOLE  (enterprise build)
  ═══════════════════════════════════════════════════════════════════════════

  ── WHAT THE SECURITY MODEL ACTUALLY IS ───────────────────────────────────

  The brief asked for the admin password to be removed from client-side JS and
  for credentials not to be exposed. In a static HTML file with no server that
  is not achievable, and it matters more to say so than to ship something that
  merely LOOKS like authentication:

    * There is nowhere but this file to check a credential, so the check is in
      this file, and anyone with developer tools can read and bypass it.
    * Hashing or obfuscating changes nothing — hash and comparison are both here.
    * Roles are enforced in the UI, not at a trust boundary. Someone determined
      can edit their own role in storage.

  What IS built is the architecture the brief needs: a single `Auth` seam with
  real session handling, real idle timeout, real logout and real role gating,
  whose local implementation is labelled a prototype on screen. Pointing it at
  Spring Boot changes ONE object — see `Auth.backend`. Nothing else in the file
  touches credentials.

  ── THE STORAGE SEAM ──────────────────────────────────────────────────────

  Every read and write goes through `Repo`, a repository layer with one method
  per business collection (`Repo.orders.list()`, `Repo.products.save()` …). The
  local implementation talks to the browser storage the customer site uses.
  Swapping in REST means replacing those method bodies; no screen code changes.
  Each collection names the endpoint it would map to.

  ── HOW THIS TALKS TO THE CUSTOMER SITE ───────────────────────────────────

  The shop has no server; its state lives in localStorage. So this console MUST
  be served from the SAME ORIGIN as index1_v57.html:

        python -m http.server 8000   →   http://localhost:8000/admin.html

  Opening via file:// usually shows an empty console, because Chromium gives
  every file:// URL its own opaque origin. That is detected and reported rather
  than silently looking like a shop with no orders.

  The shop namespaces per-customer data as `base::email`, so orders live at
  `re_invoices::someone@mail.com` and `re_invoices::guest`, never at the bare
  key. `Repo._slices()` discovers and merges them, and every write returns to
  the slice a record came from. This is the most important detail in the file: a
  console reading the bare key would report an empty shop.

  ── WHERE ADMIN DATA CANNOT REACH THE SHOP, AND WHY ───────────────────────

  Three things are admin-side only, because the shop keeps them in source rather
  than storage. They are built properly and degrade safely, but do not
  round-trip until the shop is taught to read them:

    1. PRODUCTS — the shop's catalogue is a JS literal. CRUD here writes to
       `admin_products`; use Catalogue ▸ Export shop block to generate a
       replacement PRODUCTS array to paste into the shop file.
    2. CANCELLED orders — TRACK_STEPS has five values, no cancel. Stored as
       `adminStatus:'cancelled'`, which the shop ignores.
    3. REVIEW MODERATION — shop reviews have no approval field. States live in
       `admin_review_state`; a rejected review still shows on the storefront
       until the shop filters on it.
  ═══════════════════════════════════════════════════════════════════════════
-->
<style>
/* ─── Design system ───────────────────────────────────────────────────────
   The storefront is warm, rounded and gradient-led because it is selling. A
   console is a reading instrument: dense figures, fast scanning, no misclicks.
   Hence near-black ground, one cool accent for interaction, one reserved red
   used ONLY for destruction, tabular numerals throughout, and the shop's amber
   kept solely for the brand mark so the lineage shows without the console
   feeling like a shop. */
:root{
  --bg:#0a0e15; --surface:#111726; --surface2:#161d2e; --surface3:#1c2437;
  --line:#222b3f; --line2:#2c3650;
  --ink:#e9eefb; --muted:#8b98b4; --dim:#5c6884;
  --accent:#4c9aff; --accent2:#1d3a5e; --accent3:#0f2340;
  --good:#3ddc97; --good2:#0f3327;
  --warn:#ffb454; --warn2:#33260f;
  --bad:#ff5c6c;  --bad2:#331419;
  --gold:#ff9800;
  --r:10px; --r2:14px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.22);
}

/* ═══ v60 — LIGHT MODE ═══════════════════════════════════════════════════
   Every colour in this console already came from a variable on :root, so a
   whole second theme is just a second set of values. Nothing else is touched,
   which is why the layout, spacing and component CSS are shared verbatim
   between the two — and why adding this could not break the dark theme.
   Chosen against the dark set rather than inverted: a straight inversion makes
   accents muddy and drops contrast on the status colours. */
body.light{
  --bg:#f4f6fb; --surface:#ffffff; --surface2:#f7f9fd; --surface3:#eef2f9;
  --line:#dde4ef; --line2:#c8d3e4;
  --ink:#16203a; --muted:#5a678a; --dim:#7d8aa3;
  --accent:#0b57d0; --accent2:#dbe8ff; --accent3:#eef4ff;
  --good:#12855a; --good2:#dff5ea;
  --warn:#9a6100; --warn2:#fff2d8;
  --bad:#c62839;  --bad2:#fde7ea;
  --gold:#b06a00;
  --sh:0 1px 2px rgba(16,32,64,.07),0 8px 24px rgba(16,32,64,.08);
}
/* The few places that hardcoded a dark value rather than using a variable. */
body.light .mk{color:#fff}
body.light thead th{background:var(--surface3)}
body.light ::placeholder{color:#8a95ab}
body.light #login{background:
  radial-gradient(1100px 520px at 50% -10%, #e8f0ff 0%, transparent 60%), var(--bg)}
/* v61 fix — the remaining hardcoded dark literals. These were written before
   the variables existed, so toggling the class changed nothing here and the
   console kept a dark header, dark scrim and unreadable nav text in light
   mode. Each one now has a light counterpart. */
body.light header{background:rgba(255,255,255,.92)}
body.light #scrim{background:rgba(22,32,58,.38)}
body.light .modal{background:rgba(22,32,58,.45)}
body.light nav button.on{color:var(--accent)}
body.light nav button.on .badge{background:#c9dcff;color:#0b3f96}
body.light .av{color:var(--accent)}
body.light .seg button.on{color:var(--accent)}
body.light .donut-track{stroke:var(--surface3)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:-.012em}
a{color:var(--accent);text-decoration:none}
.mono{font-family:var(--mono)}
.num,td.r,th.r,.kpi b{font-variant-numeric:tabular-nums}

/* ─── login ─── */
#login{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:20px;overflow:auto;
  background:radial-gradient(90% 70% at 50% -10%,#12203a,var(--bg) 70%)}
.lg{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);padding:26px;box-shadow:var(--sh)}
/* ─── v60: login hero ─────────────────────────────────────────────────── */
.lg-hero{text-align:center;margin:2px 0 22px}
.lg-logo{width:auto;height:112px;max-width:76%;display:block;margin:0 auto 12px;
  /* The mark is a 3D render, so a soft ground shadow sells the depth rather
     than the flat drop-shadow the old tile had. */
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.38))}
body.light .lg-logo{filter:drop-shadow(0 6px 14px rgba(16,32,64,.20))}
.lg-title{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);font-weight:700}
@media (max-width:420px){ .lg-logo{height:92px} .lg{padding:22px 18px} }
/* Keep the login readable at short viewport heights (landscape phone). */
@media (max-height:560px){ .lg-logo{height:74px;margin-bottom:8px} .lg-hero{margin-bottom:16px} }
.lg-brand{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.mk{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;
  background:linear-gradient(140deg,#ffe0a3,var(--gold));color:#1d1408;font-weight:800;font-size:16px}
.lg-brand b{font-size:15px;display:block;line-height:1.25}
.lg-brand small{color:var(--dim);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px;font-weight:600}

/* ─── shell ─── */
#shell{display:none}
#shell.on{display:block}
#scrim{position:fixed;inset:0;background:rgba(4,7,13,.6);z-index:58;display:none}
#scrim.on{display:block}

aside{position:fixed;top:0;left:0;bottom:0;width:230px;z-index:60;
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden}
.side-top{padding:15px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.side-top b{font-size:13.5px;display:block;line-height:1.25}
.side-top small{color:var(--dim);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
nav{flex:1;overflow-y:auto;padding:10px 9px}
.navgrp{margin:13px 6px 5px;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.navgrp:first-child{margin-top:2px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:8px 10px;margin-bottom:1px;border:0;border-radius:8px;
  background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;
  transition:background .12s,color .12s}
nav button:hover{background:var(--surface3);color:var(--ink)}
nav button.on{background:var(--accent2);color:#d3e6ff;font-weight:600}
nav button i{font-style:normal;width:18px;text-align:center;flex:none;font-size:13px}
nav .badge{margin-left:auto;min-width:19px;text-align:center;font-size:10px;font-weight:700;
  padding:1.5px 6px;border-radius:99px;background:var(--surface3);color:var(--muted);
  font-variant-numeric:tabular-nums}
nav button.on .badge{background:#0e2a4d;color:#cfe3ff}
nav .badge.hot{background:var(--bad2);color:var(--bad)}
.side-user{padding:11px 13px;border-top:1px solid var(--line);display:flex;align-items:center;gap:9px}
.av{width:29px;height:29px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--accent2);color:#cfe3ff;font-size:11.5px;font-weight:700}
.side-user .who{min-width:0;flex:1}
.side-user b{display:block;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user small{display:block;font-size:10px;color:var(--dim)}

header{position:sticky;top:0;z-index:40;margin-left:230px;
  background:rgba(10,14,21,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:10px 20px}
#burger{display:none}
#hdrSignOut{display:none}
#hdrTheme{display:grid}
.search{position:relative;flex:1;max-width:440px}
.search input{padding-left:31px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5;pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;
  background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);
  box-shadow:var(--sh);max-height:min(66vh,440px);overflow:auto;display:none}
.results.on{display:block}
.rgrp{padding:7px 12px 3px;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--dim);font-weight:700;background:var(--surface)}
.ritem{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border:0;
  background:transparent;width:100%;text-align:left;color:var(--ink);font:inherit;font-size:12.5px}
.ritem:hover{background:var(--accent3)}
.ritem i{font-style:normal;flex:none;opacity:.65}
.ritem .sub{color:var(--dim);font-size:11px;margin-left:auto;white-space:nowrap}
.spacer{flex:1}
.icobtn{position:relative;border:1px solid var(--line);background:var(--surface2);color:var(--muted);
  width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center;font-size:14px;flex:none}
.icobtn:hover{background:var(--surface3);color:var(--ink)}
.dot{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;
  padding:0 4px;border:2px solid var(--bg)}
main{margin-left:230px;padding:20px 24px 70px;min-width:0}

/* ─── panels ─── */
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.phead h2{font-size:20px}
.phead p{margin:3px 0 0;color:var(--muted);font-size:12.5px;max-width:74ch}
.tools{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;
  border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.ph h3{font-size:12.5px}
.ph .sub{color:var(--dim);font-size:11.5px}
.pb{padding:14px}
.kpis{display:grid;gap:10px;margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(158px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px}
.kpi span{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.kpi{min-width:0;overflow:hidden}
/* v7: a lakh-scale rupee figure at a fixed 22px is wider than a 158px card, so
   it escaped the box and collided with the caption underneath. clamp() lets the
   number shrink with the card instead of overflowing, and the wrap rules stop a
   long unbroken figure from pushing the border. */
.kpi b{
  display:block;margin-top:6px;
  font-size:clamp(15px,4.2vw,22px);
  font-weight:650;letter-spacing:-.025em;line-height:1.18;
  min-width:0;max-width:100%;
  overflow-wrap:anywhere;word-break:break-word;
}
.kpi span,.kpi small{min-width:0;max-width:100%;overflow-wrap:anywhere}
@media (min-width:1100px){ .kpi b{font-size:clamp(16px,1.55vw,22px)} }
.kpi small{display:block;margin-top:3px;color:var(--dim);font-size:11px}
.kpi.g b{color:var(--good)} .kpi.w b{color:var(--warn)} .kpi.b b{color:var(--bad)} .kpi.a b{color:var(--accent)}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* ─── controls ─── */
input,select,textarea{background:var(--surface2);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;outline:0;width:100%;transition:border-color .12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input::placeholder{color:var(--dim)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
select{cursor:pointer}
.btn{border:1px solid var(--line2);background:var(--surface2);color:var(--ink);
  border-radius:8px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;width:auto;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface3);border-color:#38445f}
.btn.p{background:var(--accent);border-color:var(--accent);color:#04162e}
.btn.p:hover{background:#6aabff}
.btn.d{background:transparent;border-color:#4a2028;color:var(--bad)}
.btn.d:hover{background:var(--bad2)}
.btn.g{background:transparent;border-color:#1c4a38;color:var(--good)}
.btn.g:hover{background:var(--good2)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;
  padding:5px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent2);color:#d3e6ff}
.seg button:hover:not(.on){color:var(--ink)}

/* ─── tables ─── */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;padding:8px 12px;color:var(--muted);font-weight:700;font-size:10px;
  letter-spacing:.07em;text-transform:uppercase;background:var(--surface2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #19202f;vertical-align:middle}
tbody tr:hover{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.nw{white-space:nowrap}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;
  letter-spacing:.03em;white-space:nowrap}
.pill.g{background:var(--good2);color:var(--good)}
.pill.o{background:var(--warn2);color:var(--warn)}
.pill.b{background:var(--bad2);color:var(--bad)}
.pill.a{background:var(--accent2);color:#a8ccff}
.pill.n{background:var(--surface3);color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--dim)}
.empty .ico{font-size:26px;opacity:.4;display:block;margin-bottom:8px}
.empty b{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}
.empty small{font-size:12px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:6px 0;border-bottom:1px solid #19202f;font-size:12.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:99px;background:var(--surface3);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{padding:11px 13px;border-radius:8px;background:var(--accent3);border:1px solid #1e3c66;
  color:#a9c8ec;font-size:12px;line-height:1.55}
.note.warn{background:var(--warn2);border-color:#4a3a12;color:#e8c47d}
.note.bad{background:var(--bad2);border-color:#4a2028;color:#f0a3ac}
.note.good{background:var(--good2);border-color:#1c4a38;color:#8fe3bb}
code{font-family:var(--mono);font-size:11.5px;background:var(--surface3);padding:1px 5px;border-radius:4px;color:#c6d4ef}

/* ─── modal ─── */
.modal{position:fixed;inset:0;z-index:120;background:rgba(4,7,13,.78);display:none;padding:20px;overflow:auto}
.modal.on{display:block}
.mcard{max-width:760px;margin:0 auto;background:var(--surface);border:1px solid var(--line2);
  border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
.mcard.wide{max-width:1010px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;
  border-bottom:1px solid var(--line);background:var(--surface2)}
.mh h3{font-size:14px}
.mb{padding:16px;max-height:calc(100vh - 200px);overflow:auto}
.mf{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface2);
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;padding:0 3px}
.x:hover{color:var(--ink)}
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:12px}
#toasts{position:fixed;right:16px;bottom:16px;z-index:400;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.tst{background:var(--surface2);border:1px solid var(--line2);border-left:3px solid var(--accent);
  border-radius:9px;padding:10px 14px;font-size:12.5px;box-shadow:var(--sh);max-width:min(340px,88vw);
  animation:tin .22s ease-out}
.tst.good{border-left-color:var(--good)} .tst.bad{border-left-color:var(--bad)} .tst.warn{border-left-color:var(--warn)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ─── charts: pure CSS/SVG, no libraries ─── */
.bars{display:flex;align-items:flex-end;gap:4px;height:128px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;min-width:0}
.bars .col i{display:block;background:var(--accent);border-radius:3px 3px 0 0}
.bars .col:hover i{background:#7ab6ff}
.axis{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-top:6px}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.lgnd{font-size:12px;flex:1;min-width:150px}
.lgnd div{display:flex;align-items:center;gap:7px;padding:3px 0}
.sw{width:9px;height:9px;border-radius:2px;flex:none}
.lgnd .v{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}

/* ─── responsive: a real drawer, not a wrapped button row ─── */
@media (max-width:960px){
  aside{transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--sh)}
  aside.open{transform:none}
  header{margin-left:0;padding:9px 12px}
  main{margin-left:0;padding:16px 13px 60px}
  #burger{display:grid}
  #hdrSignOut{display:grid;color:var(--bad)}
  .phead h2{font-size:18px}
  .kpi b{font-size:clamp(14px,5vw,19px)}
  .modal{padding:10px}
  .mb{max-height:calc(100vh - 170px)}
}
@media (max-width:560px){

    <button class="icobtn" id="hdrTheme" title="Switch to light mode"
            aria-label="Switch light or dark mode" onclick="toggleTheme()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
    <!-- v8: sign out lives in the sidebar, which becomes an off-canvas drawer
         under 960px — so on a phone the only way out was to open the menu
         first. Mirrored into the header and shown only at drawer widths, so
         desktop keeps a single control and does not gain a duplicate. -->
    <button class="icobtn" id="hdrSignOut" title="Sign out" aria-label="Sign out"
            onclick="Auth.logout('You signed out.')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button>
  </header>
  <main><div id="view"></div></main>
</div>

<div class="modal" id="modal"><div class="mcard" id="mcard">
  <div class="mh"><h3 id="mt">Detail</h3><button class="x" onclick="closeModal()" aria-label="Close">✕</button></div>
  <div class="mb" id="mb"></div>
  <div class="mf" id="mf" style="display:none"></div>
</div></div>
<div id="toasts"></div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   1. STORAGE DRIVER
   The lowest layer. Wrapped because on an opaque origin the property READ
   itself throws, not just the call — so `localStorage.length` raises before any
   key is touched. Everything above this assumes reads may fail and returns
   defaults rather than exploding.
   ═══════════════════════════════════════════════════════════════════════════ */
const DB = {
  usable(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }catch(e){ return false; } },
  get(k, dflt){ try{ const v = localStorage.getItem(k); return v == null ? dflt : JSON.parse(v); }catch(e){ return dflt; } },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){
      toast(/quota/i.test(String(e && e.name)) ? 'Storage is full — export a backup and clear old data.'
                                              : 'Could not save: storage unavailable.', 'bad');
      return false;
    }
  },
  del(k){ try{ localStorage.removeItem(k); return true; }catch(e){ return false; } },
  keys(){ const o = []; try{ for(let i=0;i<localStorage.length;i++) o.push(localStorage.key(i)); }catch(e){} return o; }
};

/* Keys owned by the customer site (read/written by both) vs keys owned by this
   console alone. Kept as one list so backup, restore and reset can never
   disagree about what belongs to whom. */
const SHOP_PREFIX  = 're_';
const ADMIN_PREFIX = 'admin_';
const K = {
  invoices:'re_invoices', notes:'re_notes', usedCoupons:'re_used_coupons',
  stock:'re_stock', accounts:'re_accounts', reviews:'re_reviews',
  prodReviews:'re_prodreviews_universal', prodReviewsAlt:'re_prodreviews',
  signedIn:'re_customer', subs:'re_subs',
  /* console-owned */
  products:'admin_products', catalogueImport:'admin_catalogue_cache',
  catalogueAt:'admin_catalogue_at', nameHints:'admin_name_hints',
  reviewState:'admin_review_state', coupons:'admin_coupons',
  stockLog:'admin_stock_log', audit:'admin_audit', notifs:'admin_notifs',
  users:'admin_users', session:'admin_session', seen:'admin_notif_seen',
  settings:'admin_settings'
};

const TRACK_STEPS = ["Order Confirmed","Packed","Shipped","Out for Delivery","Delivered"];
const ORDER_STATES = TRACK_STEPS.concat(["Cancelled"]);

/* ═══════════════════════════════════════════════════════════════════════════
   2. REPOSITORY LAYER  —  the seam for a Spring Boot backend
   ---------------------------------------------------------------------------
   Screens NEVER touch DB or localStorage directly; they call Repo.*. Each
   collection below names the REST endpoint it maps to, so migration is:

       replace the body,  keep the signature,  change nothing else.

   Signatures are deliberately promise-friendly in shape (list/get/save/remove)
   even though the local driver is synchronous — so making them async later is a
   mechanical edit rather than a redesign.
   ═══════════════════════════════════════════════════════════════════════════ */
const Repo = {

  /* The shop namespaces per-customer keys as `base::email`. Nothing else in the
     file may assume a bare key exists. */
  _slices(base){
    const out = [];
    DB.keys().forEach(k => {
      if(k === base){ out.push({owner:'(shop-wide)', key:k, val:DB.get(k,null)}); return; }
      if(k.indexOf(base + '::') === 0) out.push({owner:k.slice(base.length+2) || 'guest', key:k, val:DB.get(k,null)});
    });
    return out;
  },

  /* ── ORDERS ─────────────────────  GET/PUT /api/orders ── */
  orders:{
    list(){
      const rows = [];
      Repo._slices(K.invoices).forEach(sl => {
        if(!Array.isArray(sl.val)) return;
        sl.val.forEach((inv,i) => rows.push({
          inv, srcKey:sl.key, srcIdx:i, owner:sl.owner,
          id: sl.key + '#' + i
        }));
      });
      rows.sort((a,b) => String(b.inv.createdAt||b.inv.date||'').localeCompare(String(a.inv.createdAt||a.inv.date||'')));
      return rows;
    },
    byId(id){ return Repo.orders.list().find(r => r.id === id) || null; },
    /* Writes back to the slice the record came from — never to the bare key. */
    save(row){
      const arr = DB.get(row.srcKey, null);
      if(!Array.isArray(arr) || !arr[row.srcIdx]) return false;
      arr[row.srcIdx] = row.inv;
      return DB.set(row.srcKey, arr);
    },
    /* Effective status, honouring the admin-only cancellation the shop cannot
       represent. Single source of truth for every screen. */
    status(inv){
      if(inv && inv.adminStatus === 'cancelled') return 'Cancelled';
      return TRACK_STEPS[Math.max(0, Math.min(TRACK_STEPS.length-1, +inv.statusIndex || 0))];
    },
    setStatus(row, state){
      const before = Repo.orders.status(row.inv);
      if(state === 'Cancelled'){ row.inv.adminStatus = 'cancelled'; }
      else {
        delete row.inv.adminStatus;
        row.inv.statusIndex = Math.max(0, TRACK_STEPS.indexOf(state));
      }
      if(!Repo.orders.save(row)) return false;
      Audit.log('order.status', row.inv.no, before, state);
      Repo.customerNotes.push(row.owner, `Order ${row.inv.no} is now ${state}.`, '📦');
      return true;
    }
  },

  /* ── CUSTOMER NOTIFICATIONS (the shop's own bell) ──  POST /api/customers/{id}/notifications ── */
  customerNotes:{
    push(owner, text, icon){
      const key = (!owner || owner === '(shop-wide)') ? K.notes : K.notes + '::' + owner;
      const list = DB.get(key, []);
      if(!Array.isArray(list)) return false;
      list.unshift({text, icon: icon || '🔔', at:new Date().toISOString()});
      return DB.set(key, list.slice(0, 60));
    }
  },

  /* ── PRODUCTS ───────────────────  CRUD /api/products ──
     The shop's catalogue is a JS literal, so the console keeps its own store.
     `list()` prefers the admin store and falls back to whatever was imported,
     which is what makes the console useful before any CRUD has happened. */
  products:{
    list(){
      const own = DB.get(K.products, null);
      if(Array.isArray(own) && own.length) return own;
      const imported = DB.get(K.catalogueImport, null);
      return Array.isArray(imported) ? imported : [];
    },
    get(id){ return Repo.products.list().find(p => p.id === id) || null; },
    save(p){
      const all = Repo.products.list().slice();
      const i = all.findIndex(x => x.id === p.id);
      const before = i >= 0 ? JSON.stringify({price:all[i].price, stock:all[i].stock, active:all[i].active}) : '(new)';
      if(i >= 0) all[i] = Object.assign({}, all[i], p); else all.push(p);
      if(!DB.set(K.products, all)) return false;
      Audit.log(i >= 0 ? 'product.update' : 'product.create', p.id + ' · ' + (p.name||''),
                before, JSON.stringify({price:p.price, stock:p.stock, active:p.active}));
      return true;
    },
    remove(id){
      const all = Repo.products.list().filter(p => p.id !== id);
      if(!DB.set(K.products, all)) return false;
      Audit.log('product.delete', id, 'existed', 'removed');
      return true;
    },
    /* Seeds the editable store from an import so CRUD has something to work on
       without losing the import as a separate record. */
    seedFromImport(){
      const imported = DB.get(K.catalogueImport, null);
      if(!Array.isArray(imported) || !imported.length) return 0;
      DB.set(K.products, imported.map(p => Object.assign({active:true}, p)));
      Audit.log('product.import', imported.length + ' products', '(none)', 'seeded');
      return imported.length;
    }
  },

  /* ── INVENTORY ──────────────────  GET/PATCH /api/inventory ── */
  stock:{
    ledger(){ const l = DB.get(K.stock, {}); return (l && typeof l === 'object' && !Array.isArray(l)) ? l : {}; },
    rows(){
      const l = Repo.stock.ledger(), th = Settings.get().lowStock;
      return Object.keys(l).filter(k => k !== '__applied').map(id => {
        const r = l[id] || {};
        const qty = +r.qty || 0;
        return {id, qty, sold:+r.sold||0, units:Array.isArray(r.units)?r.units:[],
                state: qty === 0 ? 'out' : qty <= th ? 'low' : 'ok'};
      });
    },
    adjust(id, qty, reason){
      const l = Repo.stock.ledger();
      if(!l[id] || typeof l[id] !== 'object') l[id] = {qty:0, sold:0, units:[]};
      const before = +l[id].qty || 0;
      const after = Math.max(0, Math.floor(qty));
      l[id].qty = after;
      if(!DB.set(K.stock, l)) return false;
      /* An adjustment history the shop never kept, so the console keeps it. */
      const log = DB.get(K.stockLog, []);
      log.unshift({id, before, after, delta:after-before, reason:reason||'', at:new Date().toISOString(),
                   by:(Auth.session()||{}).name || 'admin'});
      DB.set(K.stockLog, log.slice(0,500));
      Audit.log('stock.adjust', id, String(before), String(after));
      return true;
    },
    history(id){
      const log = DB.get(K.stockLog, []);
      return (Array.isArray(log)?log:[]).filter(x => !id || x.id === id);
    },
    appliedCount(){ const a = Repo.stock.ledger().__applied; return Array.isArray(a) ? a.length : 0; }
  },

  /* ── CUSTOMERS ──────────────────  GET/PATCH /api/customers ── */
  customers:{
    list(){
      const accts = DB.get(K.accounts, []);
      const base = Array.isArray(accts) ? accts.slice() : [];
      const orders = Repo.orders.list();
      /* Guest and unregistered buyers still have orders, so they are surfaced as
         implicit customers rather than being invisible. */
      const known = new Set(base.map(a => String(a.email||'').toLowerCase()));
      const implied = {};
      orders.forEach(r => {
        const key = String(r.owner||'').toLowerCase();
        if(!key || known.has(key)) return;
        if(!implied[key]) implied[key] = {
          name: (r.inv.customer && r.inv.customer.name) || (key === 'guest' ? 'Walk-in customers' : key),
          email: key === 'guest' ? '' : key,
          mobile: (r.inv.customer && r.inv.customer.mobile) || '',
          implicit:true, ownerKey:key
        };
      });
      const all = base.map(a => Object.assign({ownerKey:String(a.email||'').toLowerCase()}, a))
                      .concat(Object.values(implied));
      const blocked = DB.get('admin_blocked', []);
      return all.map(c => {
        const mine = orders.filter(r => String(r.owner||'').toLowerCase() === c.ownerKey);
        return Object.assign({}, c, {
          orders: mine.length,
          spend: mine.reduce((s,r) => s + (+r.inv.grand||0), 0),
          last: mine.length ? (mine[0].inv.date || '') : '',
          blocked: (Array.isArray(blocked)?blocked:[]).indexOf(c.ownerKey) >= 0
        });
      });
    },
    setBlocked(ownerKey, yes){
      let list = DB.get('admin_blocked', []);
      if(!Array.isArray(list)) list = [];
      const i = list.indexOf(ownerKey);
      if(yes && i < 0) list.push(ownerKey);
      if(!yes && i >= 0) list.splice(i,1);
      if(!DB.set('admin_blocked', list)) return false;
      Audit.log('customer.' + (yes?'block':'unblock'), ownerKey, yes?'active':'blocked', yes?'blocked':'active');
      return true;
    }
  },

  /* ── REVIEWS ────────────────────  GET/PATCH /api/reviews ── */
  reviews:{
    list(){
      const out = [];
      const shop = DB.get(K.reviews, []);
      if(Array.isArray(shop)) shop.forEach((r,i) => out.push({r, key:K.reviews, idx:i, target:'Shop', rid:'shop:'+i}));
      const pkey = DB.get(K.prodReviews, null) ? K.prodReviews : K.prodReviewsAlt;
      const prod = DB.get(pkey, null);
      if(prod && typeof prod === 'object' && !Array.isArray(prod)){
        Object.keys(prod).forEach(pid => {
          const l = prod[pid];
          if(Array.isArray(l)) l.forEach((r,i) => out.push({r, key:pkey, pid, idx:i,
            target: productName(pid), rid:'p:'+pid+':'+i}));
        });
      }
      const st = DB.get(K.reviewState, {});
      return out.map(x => Object.assign(x, {state:(st && st[x.rid]) || 'pending'}));
    },
    setState(rid, state){
      const st = DB.get(K.reviewState, {}) || {};
      const before = st[rid] || 'pending';
      st[rid] = state;
      if(!DB.set(K.reviewState, st)) return false;
      Audit.log('review.' + state, rid, before, state);
      return true;
    },
    reply(x, text){
      if(x.pid){
        const all = DB.get(x.key, {}) || {};
        if(!all[x.pid] || !all[x.pid][x.idx]) return false;
        if(text) all[x.pid][x.idx].reply = text; else delete all[x.pid][x.idx].reply;
        if(!DB.set(x.key, all)) return false;
      } else {
        const arr = DB.get(x.key, []) || [];
        if(!arr[x.idx]) return false;
        if(text) arr[x.idx].reply = text; else delete arr[x.idx].reply;
        if(!DB.set(x.key, arr)) return false;
      }
      Audit.log('review.reply', x.rid, '', (text||'').slice(0,60));
      return true;
    },
    remove(x){
      if(x.pid){
        const all = DB.get(x.key, {}) || {};
        if(Array.isArray(all[x.pid])) all[x.pid].splice(x.idx,1);
        if(!DB.set(x.key, all)) return false;
      } else {
        const arr = DB.get(x.key, []) || [];
        arr.splice(x.idx,1);
        if(!DB.set(x.key, arr)) return false;
      }
      Audit.log('review.delete', x.rid, 'existed', 'removed');
      return true;
    }
  },

  /* ── COUPONS ────────────────────  CRUD /api/coupons ──
     Two kinds coexist deliberately. The shop GENERATES tier coupons from a
     formula and stores only which codes were spent, so those are read-only here
     and must stay that way or the shop and console would disagree. Custom
     coupons are a console-owned collection with the full lifecycle the brief
     asked for. */
  coupons:{
    STEP:250,
    LEGACY:{1:['FESTIVE500','WELCOME10','GST0']},
    tier(t){
      const n = Math.max(1, Math.floor(t)||1), S = Repo.coupons.STEP;
      const a = 500 + S*(n-1), cap = 1000 + S*(n-1), c = 250 + S*(n-1);
      const lg = Repo.coupons.LEGACY[n] || [];
      return [
        {tier:n, code: lg[0]||('FESTIVE'+a),     kind:'flat', value:a,  min:2000, label:'₹'+fmt(a)+' off'},
        {tier:n, code: lg[1]||('WELCOME10PLUS'+n), kind:'pct', value:10, cap, min:1000, label:'10% off, cap ₹'+fmt(cap)},
        {tier:n, code: lg[2]||('SAVE'+c),        kind:'flat', value:c,  min:5000, label:'₹'+fmt(c)+' off'}
      ];
    },
    spent(){
      const s = new Set();
      Repo._slices(K.usedCoupons).forEach(sl => {
        const v = sl.val;
        if(Array.isArray(v)) v.forEach(c => s.add(String(typeof c==='string'?c:(c.code||'')).toUpperCase()));
        else if(v && typeof v === 'object') Object.keys(v).forEach(c => s.add(String(c).toUpperCase()));
      });
      s.delete('');
      return s;
    },
    activeTier(){
      const sp = Repo.coupons.spent();
      for(let t=1;t<=80;t++) if(!Repo.coupons.tier(t).every(c => sp.has(c.code))) return t;
      return 1;
    },
    resetSpent(){
      Repo._slices(K.usedCoupons).forEach(sl => DB.del(sl.key));
      Audit.log('coupon.resetSpent', 'all accounts', 'spent list', 'cleared');
      return true;
    },
    custom(){ const c = DB.get(K.coupons, []); return Array.isArray(c) ? c : []; },
    saveCustom(c){
      const all = Repo.coupons.custom().slice();
      const i = all.findIndex(x => x.code === c.code);
      if(i >= 0) all[i] = Object.assign({}, all[i], c); else all.push(c);
      if(!DB.set(K.coupons, all)) return false;
      Audit.log(i>=0?'coupon.update':'coupon.create', c.code, i>=0?'existing':'(new)', JSON.stringify({kind:c.kind,value:c.value,active:c.active}));
      return true;
    },
    removeCustom(code){
      if(!DB.set(K.coupons, Repo.coupons.custom().filter(c => c.code !== code))) return false;
      Audit.log('coupon.delete', code, 'existed', 'removed');
      return true;
    }
  },

  /* ── BACKUP ─────────────────────  GET/POST /api/backup ── */
  backup:{
    create(){
      const data = {};
      DB.keys().filter(k => k.indexOf(SHOP_PREFIX)===0 || k.indexOf(ADMIN_PREFIX)===0)
        .forEach(k => { const r = DB.raw(k); if(r != null) data[k] = r; });
      return {
        app:'RAJA ELECTRONICS', kind:'admin-backup', version:2,
        at:new Date().toISOString(), origin:location.origin,
        by:(Auth.session()||{}).name || 'admin',
        counts:{ orders:Repo.orders.list().length, products:Repo.products.list().length,
                 customers:DB.get(K.accounts,[]).length, keys:Object.keys(data).length },
        data
      };
    },
    /* Validation before restore, because a bad file must fail loudly rather
       than half-overwrite a live shop. */
    validate(obj){
      const errs = [];
      if(!obj || typeof obj !== 'object') return {ok:false, errs:['The file is not JSON.']};
      if(obj.app !== 'RAJA ELECTRONICS') errs.push('Not a RAJA ELECTRONICS backup (missing app marker).');
      if(!obj.data || typeof obj.data !== 'object') errs.push('No data section.');
      const keys = obj.data ? Object.keys(obj.data) : [];
      if(!keys.length) errs.push('The data section is empty.');
      const bad = keys.filter(k => k.indexOf(SHOP_PREFIX)!==0 && k.indexOf(ADMIN_PREFIX)!==0);
      if(bad.length) errs.push(bad.length + ' key(s) are not shop or admin keys, e.g. ' + bad[0]);
      keys.forEach(k => { try{ JSON.parse(obj.data[k]); }catch(e){ errs.push('Key ' + k + ' is not valid JSON.'); } });
      return {ok:!errs.length, errs, keys:keys.length, at:obj.at, by:obj.by, counts:obj.counts||null};
    },
    restore(obj){
      /* A safety copy first, always. Restoring over live data without one is how
         a shop loses a day of orders. */
      const safety = Repo.backup.create();
      DB.set('admin_safety_backup', JSON.stringify(safety));
      let n = 0;
      Object.keys(obj.data).forEach(k => { try{ localStorage.setItem(k, obj.data[k]); n++; }catch(e){} });
      Audit.log('backup.restore', (obj.at||'') + ' · ' + n + ' keys', 'previous state', 'restored');
      return n;
    },
    safety(){ try{ return JSON.parse(DB.raw('admin_safety_backup')||'null'); }catch(e){ return null; } }
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   3. SETTINGS
   ═══════════════════════════════════════════════════════════════════════════ */
const Settings = {
  DEFAULTS:{ lowStock:3, idleMinutes:20, currency:'₹', shopName:'RAJA ELECTRONICS' },
  get(){ return Object.assign({}, Settings.DEFAULTS, DB.get(K.settings, {}) || {}); },
  set(patch){
    const before = Settings.get();
    DB.set(K.settings, Object.assign({}, before, patch));
    Object.keys(patch).forEach(k => {
      if(String(before[k]) !== String(patch[k])) Audit.log('settings.'+k, k, String(before[k]), String(patch[k]));
    });
    return true;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   4. AUTH  —  session, idle timeout, logout, RBAC
   ---------------------------------------------------------------------------
   REST MIGRATION: replace `Auth.backend` with

     Auth.backend = {
       async login(u,p){
         const r = await fetch('/api/auth/login',{method:'POST',
           headers:{'Content-Type':'application/json'},
           body:JSON.stringify({username:u,password:p})});
         if(!r.ok) return {ok:false, msg:'Invalid credentials'};
         const {token, user} = await r.json();
         return {ok:true, user, token};          // token stored, sent as Bearer
       },
       async logout(){ await fetch('/api/auth/logout',{method:'POST'}); }
     };

   Nothing else changes: every screen asks `Auth.can(...)`, never a password.
   ═══════════════════════════════════════════════════════════════════════════ */
const ROLES = {
  super:     {label:'Super Admin',     perms:['*']},
  manager:   {label:'Manager',         perms:['orders.write','products.write','stock.write','customers.write','reviews.write','coupons.write','reports.read','audit.read','backup.write']},
  sales:     {label:'Sales Staff',     perms:['orders.write','customers.read','reports.read']},
  inventory: {label:'Inventory Staff', perms:['stock.write','products.write','reports.read']},
  support:   {label:'Support Staff',   perms:['orders.read','customers.read','reviews.write']}
};

const Auth = {
  /* Prototype driver. Deliberately the ONLY place a credential is compared, so
     there is exactly one thing to replace. */
  backend:{
    login(u, p){
      const users = Auth.users();
      const found = users.find(x => x.username.toLowerCase() === String(u||'').trim().toLowerCase());
      if(!found)            return {ok:false, msg:'No such user.'};
      if(!found.active)     return {ok:false, msg:'That account is deactivated.'};
      if(found.password !== String(p||'')) return {ok:false, msg:'Incorrect password.'};
      return {ok:true, user:{username:found.username, name:found.name, role:found.role}};
    },
    logout(){ /* no-op locally; POST /api/auth/logout when a backend exists */ }
  },

  users(){
    let u = DB.get(K.users, null);
    if(!Array.isArray(u) || !u.length){
      /* First run: one Super Admin, with the password shown once on screen so it
         is never a secret buried in source that nobody can change. */
      u = [{username:'owner', name:'Shop Owner', role:'super', password:'raja-admin', active:true,
            createdAt:new Date().toISOString()}];
      DB.set(K.users, u);
    }
    return u;
  },
  saveUsers(list){ return DB.set(K.users, list); },

  session(){
    const s = DB.get(K.session, null);
    if(!s || !s.user) return null;
    const idleMs = Settings.get().idleMinutes * 60000;
    if(Date.now() - (s.touchedAt||0) > idleMs) return null;   // expired
    return s.user;
  },
  start(user){
    DB.set(K.session, {user, startedAt:Date.now(), touchedAt:Date.now()});
    Audit.log('auth.login', user.username, '', ROLES[user.role] ? ROLES[user.role].label : user.role);
  },
  touch(){
    const s = DB.get(K.session, null);
    if(s && s.user){ s.touchedAt = Date.now(); DB.set(K.session, s); }
  },
  logout(msg){
    const u = Auth.session();
    if(u) Audit.log('auth.logout', u.username, '', '');
    try{ Auth.backend.logout(); }catch(e){}
    DB.del(K.session);
    document.getElementById('shell').classList.remove('on');
    document.getElementById('login').style.display = 'grid';
    const e = document.getElementById('lgerr');
    if(msg){ e.textContent = msg; e.style.display = 'block'; e.className = 'note good'; }
    const p = document.getElementById('p'); if(p) p.value = '';
  },
  /* One question every screen asks. Wildcard for Super Admin so a new
     permission does not silently lock the owner out of its own console. */
  can(perm){
    const u = Auth.session();
    if(!u) return false;
    const r = ROLES[u.role];
    if(!r) return false;
    return r.perms.indexOf('*') >= 0 || r.perms.indexOf(perm) >= 0
        || (perm.endsWith('.read') && r.perms.indexOf(perm.replace('.read','.write')) >= 0);
  },
  roleLabel(){ const u = Auth.session(); return u && ROLES[u.role] ? ROLES[u.role].label : '—'; }
};

/* ═══════════════════════════════════════════════════════════════════════════
   5. AUDIT LOG + ADMIN NOTIFICATIONS
   Every mutating Repo method calls Audit.log with before/after, so the log is a
   by-product of doing the work rather than something a screen must remember.
   ═══════════════════════════════════════════════════════════════════════════ */
const Audit = {
  log(action, record, before, after){
    try{
      const l = DB.get(K.audit, []);
      const list = Array.isArray(l) ? l : [];
      const who = (Auth.session()||{});
      list.unshift({at:new Date().toISOString(), by:who.username||'system',
                    name:who.name||'System', role:who.role||'', action,
                    record:String(record||''), before:String(before==null?'':before).slice(0,180),
                    after:String(after==null?'':after).slice(0,180)});
      DB.set(K.audit, list.slice(0, 1000));   /* bounded: never grows forever */
    }catch(e){}
  },
  list(){ const l = DB.get(K.audit, []); return Array.isArray(l) ? l : []; }
};

/* Notifications are DERIVED from live data, not stored as events — so they can
   never drift out of sync with the shop, and there is no queue to maintain. */
const Notify = {
  build(){
    const out = [];
    const th = Settings.get().lowStock;
    Repo.orders.list().slice(0,40).forEach(r => {
      const st = Repo.orders.status(r.inv);
      if(st === 'Order Confirmed') out.push({t:'order', icon:'🧾', sev:'a',
        text:'New order '+r.inv.no+' — '+inr(r.inv.grand), at:r.inv.createdAt||r.inv.date, go:()=>{go('orders'); setTimeout(()=>viewOrder(r.id),80);}});
      else if(st !== 'Delivered' && st !== 'Cancelled') out.push({t:'delivery', icon:'🚚', sev:'o',
        text:'Pending delivery: '+r.inv.no+' ('+st+')', at:r.inv.createdAt||r.inv.date, go:()=>{go('orders'); setTimeout(()=>viewOrder(r.id),80);}});
    });
    Repo.stock.rows().forEach(s => {
      if(s.state === 'out') out.push({t:'stock', icon:'⛔', sev:'b', text:'Out of stock: '+productName(s.id), go:()=>go('inventory')});
      else if(s.state === 'low') out.push({t:'stock', icon:'⚠', sev:'o', text:'Low stock ('+s.qty+'): '+productName(s.id), go:()=>go('inventory')});
    });
    Repo.reviews.list().filter(x => !x.r.reply).slice(0,15).forEach(x =>
      out.push({t:'review', icon:'★', sev:'a', text:'Review awaiting a reply — '+x.target, go:()=>go('reviews')}));
    return out;
  },
  /* Stable identity. `t` plus the rendered text is unique per real-world
     condition and survives a reload: the same pending order, the same
     out-of-stock product and the same unanswered review always hash to the same
     id, while a genuinely new order produces a new one. No counters, no
     timestamps that drift. */
  id(x){ return String(x.t) + '|' + String(x.text); },
  /* v8: seen-state used to be a COUNT — `build().length - seen`. That is wrong
     whenever the set changes without growing: resolve one low-stock item and a
     new order arrives, the length is identical, so the dot never reappears even
     though there is something genuinely new. Worse, resolving alerts made the
     count go DOWN, and Math.max clamped it to 0, permanently hiding later
     arrivals until the total exceeded the old high-water mark.
     Seen-state is now the SET of notification ids the owner has acknowledged,
     so "new" means "an id I have not acknowledged", which is the actual
     question being asked. Stale ids are pruned so the key cannot grow forever. */
  _seenIds(){
    const v = DB.get(K.seen, null);
    if(Array.isArray(v)) return v;                 // current format
    return [];                                     // legacy number -> start clean
  },
  newItems(){
    const seen = this._seenIds();
    return Notify.build().filter(x => seen.indexOf(Notify.id(x)) < 0);
  },
  unseen(){ try{ return this.newItems().length; }catch(e){ return 0; } },
  markSeen(){
    const live = Notify.build().map(x => Notify.id(x));
    DB.set(K.seen, live);          // prune: only ids that still exist are kept
    paintBell();
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   6. UTILITIES
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { try{ return Number(n||0).toLocaleString('en-IN'); }catch(e){ return String(n); } };
const inr = n => '₹' + Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
/* v7: dashboard tiles use this instead of inr(). Two reasons the full figure was
   wrong there: paise are noise on a revenue summary, and Indian grouping makes
   large numbers very wide (₹1,45,69,829.24 is 17 characters). Crore and lakh are
   how the figure would be spoken anyway, so the tile reads faster AND fits.
   The exact value is kept in the tooltip for anyone who needs it. */
function inrShort(n){
  const v = Math.round(Number(n)||0);
  const a = Math.abs(v);
  if(a >= 1e7) return '₹' + (v/1e7).toFixed(2).replace(/\.00$/,'') + ' Cr';
  if(a >= 1e5) return '₹' + (v/1e5).toFixed(2).replace(/\.00$/,'') + ' L';
  return '₹' + v.toLocaleString('en-IN');
}
const attr = s => esc(s).replace(/'/g,'&#39;');

function toast(msg, kind){
  const box = $('toasts'); if(!box) return;
  const el = document.createElement('div');
  el.className = 'tst' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; setTimeout(()=>el.remove(), 220); }, 3000);
}
function openModal(title, html, footer, wide){
  $('mt').textContent = title;
  $('mb').innerHTML = html;
  $('mcard').className = 'mcard' + (wide ? ' wide' : '');
  const f = $('mf');
  if(footer){ f.innerHTML = footer; f.style.display = 'flex'; } else { f.style.display = 'none'; f.innerHTML=''; }
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }

function dl(name, text, mime){
  try{
    const b = new Blob([text], {type: mime || 'application/json'});
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 5000);
  }catch(e){ toast('Download failed.', 'bad'); }
}
/* ═══ v5: CSV LEGIBILITY ═════════════════════════════════════════════════
   Two things were making the CSV files hard to read in Excel.

   1. A leading BOM is now written. Without it Excel assumes the system code
      page, so ₹ and any Telugu or Hindi text in a customer name arrive as
      mojibake — which looks like corrupted data rather than an encoding issue.

   2. Numbers were being written with thousands separators (62,990). Excel then
      treats the cell as TEXT, so the column will not sum, sort or right-align.
      Numeric cells are now written bare (62990) and formatted by Excel itself.

   The delimiter is still a comma; the separator hint line some tools want is
   deliberately not written, because it breaks strict CSV parsers. If you want
   colour, banded rows and a totals line, use the Excel button — a .csv file
   has no way to carry any of that. */
function csvCell(c){
  if(c == null) return '';
  if(typeof c === 'number') return String(c);          /* never separated */
  const s = String(c);
  /* A value that is numeric but arrived as text: strip separators so Excel
     still reads it as a number. */
  if(/^-?[\d,]+(\.\d+)?$/.test(s) && s.indexOf(',') >= 0) return s.replace(/,/g,'');
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function csv(rows){
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function exportCsv(stem, rows){
  /* \uFEFF = UTF-8 byte-order mark. Excel needs it or ₹ and Indic names break. */
  dl(stem + '-' + new Date().toISOString().slice(0,10) + '.csv',
     '\uFEFF' + csv(rows), 'text/csv;charset=utf-8');
  toast((rows.length-1) + ' rows exported.', 'good');
  Audit.log('export.csv', stem, '', (rows.length-1)+' rows');
}
/* Dates in the shop's records are mixed: ISO createdAt plus dd-mm-yyyy display
   strings. One parser so every screen agrees on what "today" means. */
function dayOf(inv){
  const iso = String(inv.createdAt||'');
  if(/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso.slice(0,10);
  const d = String(inv.date||'');
  const m = d.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);
  if(m) return m[3]+'-'+m[2]+'-'+m[1];
  return '';
}
const todayKey = () => new Date().toISOString().slice(0,10);
function productName(id){
  const p = Repo.products.get(id);
  if(p && p.name) return p.name;
  const hints = DB.get(K.nameHints, {}) || {};
  return hints[id] || id;
}
/* Learns names from billed line items, so ids stop showing even with no import. */
function learnNames(){
  const hints = DB.get(K.nameHints, {}) || {};
  let changed = false;
  const prods = Repo.products.list();
  Repo.orders.list().forEach(r => (r.inv.items||[]).forEach(it => {
    const model = String(it.model||'').trim();
    if(!model) return;
    const p = prods.find(x => String(x.model||'').trim() === model);
    if(p && !hints[p.id]){ hints[p.id] = it.name || p.name; changed = true; }
  }));
  if(changed) DB.set(K.nameHints, hints);
}
function confirmAsk(title, body, danger, onYes){
  openModal(title, `<div class="note ${danger?'bad':''}">${body}</div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn ${danger?'d':'p'}" id="cfmYes">${danger?'Yes, continue':'Confirm'}</button>`);
  $('cfmYes').onclick = () => { closeModal(); onYes(); };
}
function denied(){
  return `<div class="panel"><div class="empty"><span class="ico">🔒</span>
    <b>Not available for your role</b>
    <small>You are signed in as ${esc(Auth.roleLabel())}. Ask a Super Admin for access.</small></div></div>`;
}
/* v4: the storage/origin advisory was removed on request. Only a genuine
   inability to read or write is still surfaced, because silently failing to
   save an order status would be worse than a banner. The file:// advisory is
   gone entirely. */
function originBanner(){
  if(DB.usable()) return '';
  return `<div class="note bad" style="margin-bottom:16px"><b>Cannot save.</b>
    Browser storage is unavailable, so changes made here will not be kept.</div>`;
}
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   NAVIGATION
   Grouped, because nine flat items in a sidebar reads as a list to search
   rather than a structure to navigate. Each entry declares the permission it
   needs, so RBAC is data, not scattered if-statements.
   ═══════════════════════════════════════════════════════════════════════════ */
const NAV = [
  {grp:'Overview'},
  {id:'dash',      icon:'▤',  label:'Dashboard',    perm:'orders.read'},
  {id:'reports',   icon:'📊', label:'Reports',      perm:'reports.read'},
  {grp:'Selling'},
  {id:'orders',    icon:'🧾', label:'Orders',       perm:'orders.read', badge:()=>Repo.orders.list().filter(r=>{const s=Repo.orders.status(r.inv);return s!=='Delivered'&&s!=='Cancelled';}).length},
  {id:'customers', icon:'👤', label:'Customers',    perm:'customers.read', badge:()=>Repo.customers.list().length},
  {id:'coupons',   icon:'🎟', label:'Coupons',      perm:'coupons.read'},
  {grp:'Catalogue'},
  {id:'products',  icon:'🏷', label:'Products',     perm:'products.read', badge:()=>Repo.products.list().length},
  {id:'inventory', icon:'📦', label:'Inventory',    perm:'stock.read', badge:()=>Repo.stock.rows().filter(r=>r.state!=='ok').length, hot:true},
  {id:'sold',      icon:'🔎', label:'Sold & Warranty', perm:'stock.read'},
  {id:'reviews',   icon:'★',  label:'Reviews',      perm:'reviews.read', badge:()=>Repo.reviews.list().filter(x=>!x.r.reply).length},
  {grp:'System'},
  {id:'audit',     icon:'🗒', label:'Activity Log', perm:'audit.read'},
  {id:'users',     icon:'🛡', label:'Admin Users',  perm:'*'},
  {id:'data',      icon:'⛁', label:'Data & Backup', perm:'backup.write'},
  {id:'settings',  icon:'⚙',  label:'Settings',     perm:'orders.read'}
];
const VIEWS = {};   /* filled by each screen below */
let cur = 'dash';

function renderNav(){
  let html = '';
  NAV.forEach(n => {
    if(n.grp){ html += `<div class="navgrp">${n.grp}</div>`; return; }
    if(n.perm !== '*' && !Auth.can(n.perm)) return;
    if(n.perm === '*' && !Auth.can('*')) return;
    let b = '';
    try{ const v = n.badge ? n.badge() : 0; if(v) b = `<span class="badge${n.hot?' hot':''}">${v}</span>`; }catch(e){}
    html += `<button data-nav="${n.id}" class="${n.id===cur?'on':''}" onclick="go('${n.id}')"><i>${n.icon}</i>${n.label}${b}</button>`;
  });
  $('nav').innerHTML = html;
}
function go(id){
  const item = NAV.find(n => n.id === id);
  if(item && item.perm && !(item.perm === '*' ? Auth.can('*') : Auth.can(item.perm))){
    $('view').innerHTML = denied(); drawer(false); return;
  }
  cur = id;
  renderNav();
  const fn = VIEWS[id];
  $('view').innerHTML = fn ? fn() : denied();
  if(fn && fn.after) fn.after();
  drawer(false);
  window.scrollTo(0,0);
  Auth.touch();
}
function drawer(force){
  const s = $('side'), sc = $('scrim');
  const open = force === undefined ? !s.classList.contains('open') : force;
  s.classList.toggle('open', open);
  sc.classList.toggle('on', open);
}
function phead(title, sub, tools){
  return `<div class="phead"><div><h2>${title}</h2><p>${sub||''}</p></div><div class="tools">${tools||''}</div></div>`;
}
function emptyState(icon, title, sub){
  return `<div class="empty"><span class="ico">${icon}</span><b>${title}</b><small>${sub||''}</small></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   DASHBOARD
   ═══════════════════════════════════════════════════════════════════════════ */
VIEWS.dash = function(){
  const rows = Repo.orders.list();
  const today = todayKey();
  const tRows = rows.filter(r => dayOf(r.inv) === today);
  const live = rows.filter(r => { const s = Repo.orders.status(r.inv); return s !== 'Delivered' && s !== 'Cancelled'; });
  const done = rows.filter(r => Repo.orders.status(r.inv) === 'Delivered');
  const revenue = rows.reduce((s,r) => s + (+r.inv.grand||0), 0);
  const month = new Date().toISOString().slice(0,7);
  const mRows = rows.filter(r => dayOf(r.inv).slice(0,7) === month);
  const stock = Repo.stock.rows();
  const bad = stock.filter(s => s.state !== 'ok');

  /* 14-day series */
  const byDay = {};
  rows.forEach(r => { const d = dayOf(r.inv); if(d) byDay[d] = (byDay[d]||0) + (+r.inv.grand||0); });
  const days = [];
  for(let i=13;i>=0;i--){ const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10); days.push({d, v:byDay[d]||0}); }
  const peak = Math.max(1, ...days.map(x=>x.v));

  /* status + payment mixes */
  const byStatus = {}; ORDER_STATES.forEach(s => byStatus[s]=0);
  rows.forEach(r => byStatus[Repo.orders.status(r.inv)]++);
  const byPay = {};
  rows.forEach(r => { const m = r.inv.payment || '—'; byPay[m] = (byPay[m]||0)+1; });

  /* top sellers, from real billed line items */
  const sellers = {};
  rows.forEach(r => (r.inv.items||[]).forEach(it => {
    const k = it.name || it.model || '—';
    if(!sellers[k]) sellers[k] = {qty:0, rev:0};
    sellers[k].qty += (+it.qty||0);
    sellers[k].rev += (+it.qty||0) * (+(it.price||it.rate)||0);
  }));
  const top = Object.keys(sellers).map(k => ({name:k, ...sellers[k]}))
    .sort((a,b)=>b.rev-a.rev).slice(0,6);

  const SC = {'Order Confirmed':'#4c9aff','Packed':'#7c6bff','Shipped':'#ffb454',
              'Out for Delivery':'#ff8a3d','Delivered':'#3ddc97','Cancelled':'#ff5c6c'};

  return originBanner() + phead('Dashboard',
    'Live from this browser\'s storage — the same data the shop reads.',
    `<button class="btn" onclick="go('reports')">Reports</button>
     ${Auth.can('backup.write')?`<button class="btn p" onclick="go('data')">Backup now</button>`:''}`) +
  `<div class="kpis">
    <div class="kpi a" title="${attr(inr(tRows.reduce((s,r)=>s+(+r.inv.grand||0),0)))}"><span>Today's sales</span><b>${inrShort(tRows.reduce((s,r)=>s+(+r.inv.grand||0),0))}</b><small>${tRows.length} order${tRows.length===1?'':'s'} today</small></div>
    <div class="kpi" title="${attr(inr(mRows.reduce((s,r)=>s+(+r.inv.grand||0),0)))}"><span>Monthly sales</span><b>${inrShort(mRows.reduce((s,r)=>s+(+r.inv.grand||0),0))}</b><small>${mRows.length} this month</small></div>
    <div class="kpi g" title="${attr(inr(revenue))}"><span>Total revenue</span><b>${inrShort(revenue)}</b><small>${rows.length} invoice${rows.length===1?'':'s'}</small></div>
    <div class="kpi" title="${attr(inr(rows.length?revenue/rows.length:0))}"><span>Average order</span><b>${inrShort(rows.length?revenue/rows.length:0)}</b><small>lifetime</small></div>
    <div class="kpi ${live.length?'w':''}"><span>Pending orders</span><b>${live.length}</b><small>not yet delivered</small></div>
    <div class="kpi g"><span>Completed</span><b>${done.length}</b><small>delivered</small></div>
    <div class="kpi ${bad.length?'b':''}"><span>Stock alerts</span><b>${bad.length}</b><small>low or out of stock</small></div>
    <div class="kpi"><span>Customers</span><b>${Repo.customers.list().length}</b><small>${Repo.products.list().length} products</small></div>
  </div>

  <div class="g2">
    <div class="panel">
      <div class="ph"><h3>Revenue — last 14 days</h3><span class="sub">peak ${inr(peak)}</span></div>
      <div class="pb">
        ${days.every(x=>!x.v) ? emptyState('📉','No sales in this period','Completed bills appear here automatically.') :
        colouredBars(days.map(x => ({label:x.d.slice(5), value:x.v})))}
      </div>
    </div>
    <div class="panel">
      <div class="ph"><h3>Order status</h3></div>
      <div class="pb">
        ${rows.length ? `<div class="donut">
          ${donutSvg(ORDER_STATES.filter(s=>byStatus[s]).map(s=>({v:byStatus[s], c:SC[s]})))}
          <div class="lgnd">${ORDER_STATES.filter(s=>byStatus[s]).map(s=>
            `<div><span class="sw" style="background:${SC[s]}"></span>${s}<span class="v">${byStatus[s]}</span></div>`).join('')}</div>
        </div>` : emptyState('🧾','No orders yet','')}
      </div>
    </div>
  </div>

  <div class="g2">
    <div class="panel">
      <div class="ph"><h3>Top selling products</h3><span class="sub">by revenue</span></div>
      ${top.length ? `<div class="tw"><table><thead><tr><th>Product</th><th class="r">Units</th><th class="r">Revenue</th></tr></thead>
        <tbody>${top.map(t=>`<tr><td>${esc(t.name)}</td><td class="r">${t.qty}</td><td class="r">${inr(t.rev)}</td></tr>`).join('')}</tbody></table></div>`
        : emptyState('🏷','Nothing sold yet','')}
    </div>
    <div class="panel">
      <div class="ph"><h3>Payment methods</h3></div>
      <div class="pb">${Object.keys(byPay).length ? Object.keys(byPay).sort((a,b)=>byPay[b]-byPay[a]).map(m=>
        `<div class="kv"><span>${esc(m)}</span><b>${byPay[m]} · ${Math.round(byPay[m]/rows.length*100)}%</b></div>
         <div class="bar"><i style="width:${Math.round(byPay[m]/rows.length*100)}%"></i></div>`).join('')
        : emptyState('💳','No payments recorded','')}</div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h3>Recent orders</h3><button class="btn sm" onclick="go('orders')">See all</button></div>
    ${rows.length ? `<div class="tw"><table>
      <thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Payment</th><th>Status</th><th class="r">Total</th></tr></thead>
      <tbody>${rows.slice(0,8).map(r=>`<tr onclick="viewOrder('${attr(r.id)}')" style="cursor:pointer">
        <td class="mono">${esc(r.inv.no)}</td>
        <td>${esc((r.inv.customer&&r.inv.customer.name)||'—')}</td>
        <td class="mono nw">${esc(r.inv.date||'')}</td>
        <td>${esc(r.inv.payment||'—')}</td>
        <td>${statusPill(Repo.orders.status(r.inv))}</td>
        <td class="r">${inr(r.inv.grand)}</td></tr>`).join('')}</tbody></table></div>`
      : emptyState('🧾','No invoices yet','Complete a bill on the shop and it appears here.')}

/* A donut without a chart library: one SVG circle per slice, drawn with
   stroke-dasharray. Cheap, sharp at any size, no dependency to break. */
function donutSvg(slices){
  const total = slices.reduce((s,x)=>s+x.v,0) || 1;
  const R = 54, C = 2*Math.PI*R;
  let off = 0;
  const rings = slices.map(s => {
    const len = s.v/total*C;
    const el = `<circle cx="64" cy="64" r="${R}" fill="none" stroke="${s.c}" stroke-width="17"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"
      transform="rotate(-90 64 64)" stroke-linecap="butt"/>`;
    off += len; return el;
  }).join('');
  return `<svg width="128" height="128" viewBox="0 0 128 128" style="flex:none">
    <circle class="donut-track" cx="64" cy="64" r="${R}" fill="none" stroke="#1c2437" stroke-width="17"/>${rings}
    <text x="64" y="61" text-anchor="middle" fill="#e9eefb" font-size="21" font-weight="700">${total}</text>
    <text x="64" y="77" text-anchor="middle" fill="#5c6884" font-size="9.5" letter-spacing="1">ORDERS</text></svg>`;
}
function statusPill(s){
  const c = s==='Delivered' ? 'g' : s==='Cancelled' ? 'b' : s==='Order Confirmed' ? 'a' : 'o';
  return `<span class="pill ${c}">${esc(s)}</span>`;
}

function importCatalogue(input){
  const file = input.files && input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const txt = String(rd.result||'');
      const i = txt.indexOf('const PRODUCTS = [');
      if(i < 0) return toast('No PRODUCTS array found in that file.', 'bad');
      /* Bracket-walk rather than regex: a regex stops at the first ] inside a
         nested specs object or tags array and truncates the catalogue. */
      let j = txt.indexOf('[', i), depth = 0, end = -1;
      for(let k=j;k<txt.length;k++){
        const ch = txt[k];
        if(ch === '[') depth++;
        else if(ch === ']'){ depth--; if(!depth){ end = k; break; } }
      }
      if(end < 0) return toast('Could not find the end of the product list.', 'bad');
      const src = txt.slice(j, end+1);
      /* The literal references image constants declared elsewhere in the shop
         (SONY_TV_PHOTO and friends). Those are base64 blobs this console does
         not need, so bare identifiers are bound to null through the function's
         own parameters — stripping them by regex would corrupt the object whose
         value they are. */
      const names = [...new Set((src.match(/:\s*([A-Z][A-Z0-9_]{2,})\s*[,}]/g)||[])
        .map(m => m.replace(/^[:\s]+/,'').replace(/[,}\s]+$/,'')))];
      const arr = new Function(...names, 'return ' + src)(...names.map(()=>null));
      if(!Array.isArray(arr) || !arr.length) return toast('The product list was empty.', 'bad');
      const slim = arr.map(p => ({id:p.id, name:p.name, brand:p.brand, model:p.model, cat:p.cat,
        hsn:p.hsn, price:p.price, old:p.old, gst:p.gst, stock:p.stock,
        warranty:p.warranty, desc:p.desc, specs:p.specs||{}, active:true}));
      DB.set(K.catalogueImport, slim);
      DB.set(K.catalogueAt, new Date().toISOString().slice(0,16).replace('T',' '));
      Repo.products.seedFromImport();
      learnNames();
      toast(slim.length + ' products imported.', 'good');
      go('products');
    }catch(e){ toast('Could not parse that file: ' + e.message, 'bad'); }
  };
  rd.readAsText(file);
}

      <div><div class="kv"><span>Email</span><b class="mono">${esc(c.email||'—')}</b></div>
        <div class="kv"><span>Mobile</span><b class="mono">${esc(c.mobile||'—')}</b></div>
        <div class="kv"><span>Account key</span><b class="mono">${esc(c.ownerKey||'—')}</b></div></div>
      <div><div class="kv"><span>Orders</span><b>${c.orders}</b></div>
        <div class="kv"><span>Lifetime spend</span><b>${inr(c.spend)}</b></div>
        <div class="kv"><span>Average order</span><b>${inr(c.orders?c.spend/c.orders:0)}</b></div>
        <div class="kv"><span>Status</span><b>${c.blocked?'Blocked':'Active'}</b></div></div>
    </div>
    <div style="color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px">Invoice history</div>
    ${orders.length ? `<div class="tw"><table><thead><tr><th>Invoice</th><th>Date</th><th>Payment</th><th>Status</th><th class="r">Total</th></tr></thead>
      <tbody>${orders.map(r=>`<tr><td class="mono">${esc(r.inv.no)}</td><td class="mono nw">${esc(r.inv.date)}</td>
        <td>${esc(r.inv.payment||'—')}</td><td>${statusPill(Repo.orders.status(r.inv))}</td>
        <td class="r">${inr(r.inv.grand)}</td></tr>`).join('')}</tbody></table></div>`
      : '<div class="empty">No orders.</div>'}
    ${revs.length ? `<div style="color:var(--muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin:16px 0 6px">Reviews</div>

function toggleBlock(ownerKey, yes){

function exportCustomers(){

let rfil = 'all';
const REV_STATES = ['pending','approved','rejected','hidden','reported'];
VIEWS.reviews = function(){
  const all = Repo.reviews.list();
  /* v4: filters are now by WHERE the review lives and whether it has been
     answered — the two things that are actually true of the shop's data. The
     moderation states were console-only and could never reach the storefront,
     so the column and its dropdown are gone. */
  const counts = {
    all: all.length,
    shop: all.filter(x => x.target === 'Shop').length,
    product: all.filter(x => x.target !== 'Shop').length,
    replied: all.filter(x => x.r.reply).length,
    unreplied: all.filter(x => !x.r.reply).length
  };
  const rows = rfil === 'all' ? all
    : rfil === 'shop'      ? all.filter(x => x.target === 'Shop')
    : rfil === 'product'   ? all.filter(x => x.target !== 'Shop')
    : rfil === 'replied'   ? all.filter(x => x.r.reply)
    : rfil === 'unreplied' ? all.filter(x => !x.r.reply)
    : all;

  return originBanner() + phead('Reviews', 'Shop reviews and per-product reviews, with replies and moderation.') +
  `<div class="seg" style="margin-bottom:14px">
    <button class="${rfil==='all'?'on':''}" onclick="setRfil('all')">All ${counts.all}</button>
    <button class="${rfil==='shop'?'on':''}" onclick="setRfil('shop')">Shop ${counts.shop}</button>
    <button class="${rfil==='product'?'on':''}" onclick="setRfil('product')">Product ${counts.product}</button>
    <button class="${rfil==='replied'?'on':''}" onclick="setRfil('replied')">Replied ${counts.replied}</button>
    <button class="${rfil==='unreplied'?'on':''}" onclick="setRfil('unreplied')">Awaiting reply ${counts.unreplied}</button>
  </div>
  <div class="panel">
    <div class="ph"><h3>${rows.length} review${rows.length===1?'':'s'}</h3></div>
    ${rows.length ? `<div class="tw"><table>
      <thead><tr><th>Target</th><th>Author</th><th class="r">Rating</th><th>Review</th>
        <th>Posted on</th><th></th></tr></thead>
      <tbody>${rows.map(x=>`<tr>
        <td><span class="pill ${x.target==='Shop'?'a':'n'}">${esc(x.target)}</span></td>
        <td>${esc(x.r.name||x.r.author||'—')}</td>
        <td class="r nw" style="color:var(--warn)">${'★'.repeat(Math.max(0,Math.min(5,+x.r.stars||+x.r.rating||0)))||'—'}</td>
        <td style="max-width:320px">${esc(String(x.r.text||x.r.body||'').slice(0,150))}
          ${x.r.reply?`<div style="margin-top:5px;padding-left:9px;border-left:2px solid var(--accent2);color:var(--muted);font-size:11.5px">↳ ${esc(String(x.r.reply).slice(0,120))}</div>`:''}</td>
        <td class="mono nw" style="font-size:11.5px">${reviewWhen(x.r)}</td>
        <td class="nw">${Auth.can('reviews.write')?`
          <button class="btn sm" onclick="replyReview('${attr(x.rid)}')">Reply</button>
          <button class="btn sm d" onclick="delReview('${attr(x.rid)}')">Delete</button>`:'view only'}</td>
      </tr>`).join('')}</tbody></table></div>`
      : emptyState('★','No reviews in this state','')}
  </div>
  `;
};
function revPill(s){
  const c = s==='approved'?'g':s==='rejected'?'b':s==='reported'?'b':s==='hidden'?'n':'o';
  return `<span class="pill ${c}">${s[0].toUpperCase()+s.slice(1)}</span>`;
}
function setRfil(f){ rfil = f; go('reviews'); }
function setRevState(rid, s){ if(Repo.reviews.setState(rid, s)){ toast('Marked ' + s + '.', 'good'); go('reviews'); } }
function replyReview(rid){
  const x = Repo.reviews.list().find(y => y.rid === rid); if(!x) return;
  openModal('Reply — ' + (x.r.name||x.r.author||'review'), `
    <div class="note" style="margin-bottom:12px">${esc(String(x.r.text||x.r.body||''))}</div>
    <div class="fld"><label>Your public reply</label>
      <textarea id="rep" rows="4" placeholder="Shown under the review on the shop…">${esc(x.r.reply||'')}</textarea></div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn p" onclick="saveReply('${attr(rid)}')">Save reply</button>`);
}
function saveReply(rid){
  const x = Repo.reviews.list().find(y => y.rid === rid); if(!x) return;
  if(Repo.reviews.reply(x, String($('rep').value||'').trim())){ closeModal(); toast('Reply saved.', 'good'); go('reviews'); }
  else toast('Could not save.', 'bad');
}
function delReview(rid){
  const x = Repo.reviews.list().find(y => y.rid === rid); if(!x) return;
  confirmAsk('Delete review', 'Permanently remove this review from the shop? This cannot be undone.', true, () => {
    if(Repo.reviews.remove(x)){ toast('Review deleted.', 'good'); go('reviews'); }
  });
}

  const spent = Repo.coupons.spent();

  return originBanner() + phead('Coupons',
    'Two systems: the shop\'s automatic tiers, and your own custom coupons.',

  `<div class="kpis">
    <div class="kpi a"><span>Active tier</span><b>${tier}</b><small>set customers can use now</small></div>

  <div class="panel">
    <div class="ph"><h3>Custom coupons</h3><span class="sub">managed here</span></div>
    ${custom.length ? `<div class="tw"><table>
      <thead><tr><th>Code</th><th>Type</th><th class="r">Value</th><th class="r">Min order</th>
        <th class="r">Cap</th><th>Scope</th><th>Expires</th><th class="r">Used / limit</th><th>State</th><th></th></tr></thead>
      <tbody>${custom.map(c=>{
        const expired = c.expires && c.expires < today;
        const exhausted = c.limit && (+c.used||0) >= +c.limit;
        return `<tr>
        <td class="mono"><b>${esc(c.code)}</b></td>
        <td>${c.kind==='pct'?'Percentage':'Fixed'}</td>
        <td class="r">${c.kind==='pct'?esc(c.value)+'%':inr(c.value)}</td>
        <td class="r">${c.min?inr(c.min):'—'}</td>
        <td class="r">${c.cap?inr(c.cap):'—'}</td>
        <td>${c.scopeType&&c.scopeType!=='all'?`<span class="pill n">${esc(c.scopeType)}: ${esc(c.scopeValue||'')}</span>`:'<span class="pill n">All products</span>'}</td>
        <td class="mono nw ${expired?'':''}" style="color:${expired?'var(--bad)':'var(--dim)'}">${esc(c.expires||'—')}</td>
        <td class="r">${+c.used||0}${c.limit?' / '+c.limit:''}${c.perCustomer?`<div style="color:var(--dim);font-size:11px">${c.perCustomer}/customer</div>`:''}</td>
        <td>${!c.active?'<span class="pill n">Inactive</span>':expired?'<span class="pill b">Expired</span>':exhausted?'<span class="pill b">Used up</span>':'<span class="pill g">Active</span>'}</td>
        <td class="nw">${Auth.can('coupons.write')?`<button class="btn sm" onclick="editCoupon('${attr(c.code)}')">Edit</button>
          <button class="btn sm" onclick="toggleCoupon('${attr(c.code)}')">${c.active?'Disable':'Enable'}</button>
          <button class="btn sm d" onclick="delCoupon('${attr(c.code)}')">Delete</button>`:''}</td>
      </tr>`;}).join('')}</tbody></table></div>`

  <div class="panel">
    <div class="ph"><h3>Shop tier coupons</h3><span class="sub">generated by formula — read-only</span></div>
    <div class="tw"><table><thead><tr><th>Tier</th><th>Code</th><th>Benefit</th><th class="r">Min bill</th><th>State</th></tr></thead>

          <td class="r">${inr(c.min)}</td><td>${st}</td></tr>`;}).join('')}</tbody></table></div>

      <div class="fld"><label>Applies to</label>
        <select id="c_scope"><option value="all" ${v.scopeType==='all'?'selected':''}>All products</option>
          <option value="category" ${v.scopeType==='category'?'selected':''}>One category</option>
          <option value="product" ${v.scopeType==='product'?'selected':''}>One product</option></select></div>
      <div class="fld"><label>Category or product ID</label>
        <input id="c_scopev" value="${attr(v.scopeValue)}" list="scopeList" placeholder="e.g. tv or tv1">
        <datalist id="scopeList">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}
