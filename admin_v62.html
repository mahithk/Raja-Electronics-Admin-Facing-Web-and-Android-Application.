    for an uncapped percentage.</div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn p" onclick="saveCoupon(${code?"'"+attr(code)+"'":'null'})">${code?'Save changes':'Create coupon'}</button>`, true);
}
function saveCoupon(code){
  const cc = String($('c_code').value||'').trim().toUpperCase();
  if(!cc) return toast('A coupon code is required.', 'bad');
  if(!code && Repo.coupons.custom().some(x => x.code === cc)) return toast('That code already exists.', 'bad');
  if(!code && Repo.coupons.spent().has(cc)) return toast('That code clashes with a shop tier coupon.', 'bad');
  const val = +$('c_value').value||0;
  if(val <= 0) return toast('Enter a discount value above zero.', 'bad');
  if($('c_kind').value === 'pct' && val > 100) return toast('A percentage cannot exceed 100.', 'bad');
  const prev = code ? Repo.coupons.custom().find(x=>x.code===code) : null;
  const c = {
    code:cc, kind:$('c_kind').value, value:val,
    min:+$('c_min').value||0, cap:+$('c_cap').value||0,
    expires:String($('c_exp').value||''), limit:+$('c_limit').value||0,
    perCustomer:+$('c_per').value||0,
    scopeType:$('c_scope').value, scopeValue:String($('c_scopev').value||'').trim(),
    active:$('c_active').checked, used:(prev&&+prev.used)||0,
    createdAt:(prev&&prev.createdAt)||new Date().toISOString()
  };
  if(Repo.coupons.saveCustom(c)){ closeModal(); toast(code?'Coupon updated.':'Coupon created.', 'good'); go('coupons'); }
  else toast('Could not save.', 'bad');
}
function toggleCoupon(code){
  const c = Repo.coupons.custom().find(x=>x.code===code); if(!c) return;
  c.active = !c.active;
  if(Repo.coupons.saveCustom(c)){ toast(c.code + (c.active?' enabled.':' disabled.'), 'good'); go('coupons'); }
}
function delCoupon(code){
  confirmAsk('Delete coupon', `Delete <code>${esc(code)}</code>? Bills that already used it are unaffected.`, true, () => {
    if(Repo.coupons.removeCustom(code)){ toast('Coupon deleted.', 'good'); go('coupons'); }
  });
}
function resetSpent(){
  confirmAsk('Reset spent tier coupons',
    'Clear the spent-coupon list for <b>every account on this device</b>? Customers will be able to redeem tier 1 codes again. This cannot be undone.',
    true, () => { Repo.coupons.resetSpent(); toast('Spent coupons cleared.', 'good'); go('coupons'); });
}

/* ═══════════════════════════════════════════════════════════════════════════
   REPORTS
   ═══════════════════════════════════════════════════════════════════════════ */
/* v4: 'day' + 'ly' produced "Dayly". English adverbs are irregular, so the
   labels are a map rather than string arithmetic. */
const PERIOD_LABEL = {day:'Daily', week:'Weekly', month:'Monthly', year:'Yearly'};
let rpPeriod = 'day';
VIEWS.reports = function(){
  const rows = Repo.orders.list().filter(r => Repo.orders.status(r.inv) !== 'Cancelled');
  const keyOf = r => {
    const d = dayOf(r.inv); if(!d) return '';
    if(rpPeriod === 'day')   return d;
    if(rpPeriod === 'month') return d.slice(0,7);
    if(rpPeriod === 'year')  return d.slice(0,4);
    /* ISO-ish week bucket: good enough for a shop report and needs no library. */
    const dt = new Date(d + 'T00:00:00Z');
    const t = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
    const wk = Math.ceil((((dt-t)/86400000)+t.getUTCDay()+1)/7);
    return d.slice(0,4) + '-W' + String(wk).padStart(2,'0');
  };
  const buckets = {};
  rows.forEach(r => { const k = keyOf(r); if(!k) return;
    if(!buckets[k]) buckets[k] = {n:0, rev:0, gst:0, disc:0, units:0};
    const b = buckets[k];
    b.n++; b.rev += +r.inv.grand||0; b.gst += +r.inv.gstAmt||0;
    b.disc += (+r.inv.discount||0) + (+r.inv.couponAmt||0);
    b.units += (r.inv.items||[]).reduce((s,i)=>s+(+i.qty||0),0);
  });
  const keys = Object.keys(buckets).sort().reverse().slice(0, 40);
  const peak = Math.max(1, ...keys.map(k=>buckets[k].rev));

  /* product & category rollups */
  const prods = {}, cats = {}, pays = {}, coupons = {};
  const pIndex = {};
  Repo.products.list().forEach(p => { if(p.model) pIndex[String(p.model).trim()] = p; });
  rows.forEach(r => {
    (r.inv.items||[]).forEach(it => {
      const nm = it.name || it.model || '—';
      if(!prods[nm]) prods[nm] = {qty:0, rev:0};
      prods[nm].qty += +it.qty||0;
      prods[nm].rev += (+it.qty||0)*(+(it.price||it.rate)||0);
      const p = pIndex[String(it.model||'').trim()];
      const cat = p ? (p.cat||'—') : '—';
      if(!cats[cat]) cats[cat] = {qty:0, rev:0};
      cats[cat].qty += +it.qty||0;
      cats[cat].rev += (+it.qty||0)*(+(it.price||it.rate)||0);
    });
    const m = r.inv.payment || '—';
    if(!pays[m]) pays[m] = {n:0, rev:0};
    pays[m].n++; pays[m].rev += +r.inv.grand||0;
    if(r.inv.coupon){ const c = String(r.inv.coupon).toUpperCase();
      if(!coupons[c]) coupons[c] = {n:0, amt:0};
      coupons[c].n++; coupons[c].amt += +r.inv.couponAmt||0; }
  });
  const tbl = (obj, cols, sortKey) => {
    const ks = Object.keys(obj).sort((a,b)=>obj[b][sortKey]-obj[a][sortKey]).slice(0,15);
    if(!ks.length) return emptyState('📊','No data','');
    return `<div class="tw"><table><thead><tr><th>${cols[0]}</th>
      <th class="r">${cols[1]}</th><th class="r">${cols[2]}</th></tr></thead>
      <tbody>${ks.map(k=>`<tr><td>${esc(k)}</td>
        <td class="r">${fmt(obj[k][cols[3]])}</td>
        <td class="r">${inr(obj[k][cols[4]])}</td></tr>`).join('')}</tbody></table></div>`;
  };

  return originBanner() + phead('Reports',
    'Cancelled orders are excluded from every figure below.',
    `<div class="seg">
      ${Object.keys(PERIOD_LABEL).map(p=>`<button class="${rpPeriod===p?'on':''}" onclick="setPeriod('${p}')">${PERIOD_LABEL[p]}</button>`).join('')}
     </div>
     <button class="btn" onclick="exportReportExcel()">Excel</button>
     <button class="btn" onclick="exportReport()">CSV</button>`) +
  `<div class="panel">
    <div class="ph"><h3>${PERIOD_LABEL[rpPeriod]} sales</h3>
      <span class="sub">${keys.length} period${keys.length===1?'':'s'} · peak ${inr(peak)}</span></div>
    ${keys.length ? `<div class="pb">
        ${colouredBars(keys.slice(0,24).reverse().map(k => ({label:k, value:buckets[k].rev})))}
      </div>
      <div class="tw"><table><thead><tr><th>Period</th><th class="r">Orders</th><th class="r">Units</th>
        <th class="r">Discounts</th><th class="r">GST</th><th class="r">Revenue</th></tr></thead>
        <tbody>${keys.map(k=>`<tr><td class="mono">${esc(k)}</td><td class="r">${buckets[k].n}</td>
          <td class="r">${buckets[k].units}</td><td class="r">${inr(buckets[k].disc)}</td>
          <td class="r">${inr(buckets[k].gst)}</td><td class="r"><b>${inr(buckets[k].rev)}</b></td></tr>`).join('')}
        </tbody></table></div>`
      : emptyState('📊','No sales to report','Completed bills appear here automatically.')}
  </div>
  <div class="g2">

function editUser(username){
  const users = Auth.users();
  const u = username ? users.find(x=>x.username===username) : null;
  const v = u || {username:'', name:'', role:'sales', password:'', active:true};
  openModal(username?'Edit admin':'Add admin', `
    <div class="frow">
      <div class="fld"><label>Full name *</label><input id="u_name" value="${attr(v.name)}"></div>
      <div class="fld"><label>Username *</label>
        <input id="u_user" value="${attr(v.username)}" ${username?'readonly style="opacity:.6"':''}></div>
    </div>
    <div class="frow">
      <div class="fld"><label>Role</label>
        <select id="u_role">${Object.keys(ROLES).map(k=>`<option value="${k}" ${v.role===k?'selected':''}>${esc(ROLES[k].label)}</option>`).join('')}</select></div>
      ${username?'':`<div class="fld"><label>Password *</label><input id="u_pw" type="text" placeholder="Set an initial password"></div>`}
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px">
      <input type="checkbox" id="u_active" ${v.active?'checked':''}> Active — may sign in</label>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn p" onclick="saveUser(${username?"'"+attr(username)+"'":'null'})">${username?'Save':'Add admin'}</button>`);
}
function saveUser(username){
  const users = Auth.users().slice();
  const name = String($('u_name').value||'').trim();
  const un = String($('u_user').value||'').trim().toLowerCase();
  if(!name || !un) return toast('Name and username are both required.', 'bad');
  if(!username && users.some(x=>x.username===un)) return toast('That username is taken.', 'bad');
  const role = $('u_role').value, active = $('u_active').checked;
  if(username){
    const i = users.findIndex(x=>x.username===username);
    const before = users[i].role + '/' + (users[i].active?'active':'inactive');
    /* The last active Super Admin must not be able to demote or disable itself
       out of existence — that would lock the owner out of its own console with
       no recovery path. */
    const supers = users.filter(x=>x.role==='super'&&x.active);
    if(users[i].role==='super' && supers.length===1 && (role!=='super' || !active))
      return toast('This is the only active Super Admin — promote another first.', 'bad');
    users[i] = Object.assign({}, users[i], {name, role, active});
    Auth.saveUsers(users);
    Audit.log('adminuser.update', un, before, role + '/' + (active?'active':'inactive'));
    toast('Admin updated.', 'good');
  } else {
    const pw = String($('u_pw').value||'');
    if(pw.length < 6) return toast('Set a password of at least 6 characters.', 'bad');
    users.push({username:un, name, role, password:pw, active, createdAt:new Date().toISOString()});
    Auth.saveUsers(users);
    Audit.log('adminuser.create', un, '(new)', role);
    toast('Admin added.', 'good');
  }
  closeModal(); go('users');
}
function resetPw(username){
  openModal('Reset password — ' + username, `
    <div class="fld"><label>New password</label><input id="np" type="text" placeholder="At least 6 characters"></div>
    <div class="note warn">With no backend there is nowhere to email a reset link,
    so the new password is set directly and shown to you once. Pass it on in
    person. A real deployment would send a one-time link instead.</div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn p" onclick="doResetPw('${attr(username)}')">Set password</button>`);
}
function doResetPw(username){
  const pw = String($('np').value||'');
  if(pw.length < 6) return toast('At least 6 characters, please.', 'bad');
  const users = Auth.users().slice();
  const i = users.findIndex(x=>x.username===username); if(i<0) return;
  users[i].password = pw;
  Auth.saveUsers(users);
  Audit.log('adminuser.resetPassword', username, '', '(changed)');
  closeModal(); toast('Password changed.', 'good');
}
function toggleUser(username){
  const users = Auth.users().slice();
  const i = users.findIndex(x=>x.username===username); if(i<0) return;
  const supers = users.filter(x=>x.role==='super'&&x.active);
  if(users[i].role==='super' && users[i].active && supers.length===1)
    return toast('This is the only active Super Admin.', 'bad');
  users[i].active = !users[i].active;
  Auth.saveUsers(users);
  Audit.log('adminuser.' + (users[i].active?'activate':'deactivate'), username, '', '');
  toast(users[i].active?'Activated.':'Deactivated.', 'good'); go('users');
}
function delUser(username){
  confirmAsk('Remove admin', `Remove <b>${esc(username)}</b>? They will no longer be able to sign in.`, true, () => {
    const users = Auth.users().filter(x=>x.username!==username);
    if(!users.some(x=>x.role==='super'&&x.active)) return toast('That would leave no active Super Admin.', 'bad');
    Auth.saveUsers(users);
    Audit.log('adminuser.delete', username, 'existed', 'removed');
    toast('Admin removed.', 'good'); go('users');
  });
}

/* Restore is a two-step: validate and report, then confirm. Never blind. */
function stageRestore(input){
  const file = input.files && input.files[0]; if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let obj = null;
    try{ obj = JSON.parse(String(rd.result||'')); }
    catch(e){ return toast('That file is not valid JSON.', 'bad'); }
    const v = Repo.backup.validate(obj);
    const rows = v.counts ? `<div class="kv"><span>Orders in file</span><b>${esc(v.counts.orders)}</b></div>
      <div class="kv"><span>Products</span><b>${esc(v.counts.products)}</b></div>
      <div class="kv"><span>Customers</span><b>${esc(v.counts.customers)}</b></div>` : '';
    openModal('Review this backup before restoring', `
      <div class="kv"><span>Created</span><b class="mono">${esc(String(v.at||'unknown').slice(0,16).replace('T',' '))}</b></div>
      <div class="kv"><span>By</span><b>${esc(v.by||'unknown')}</b></div>
      <div class="kv"><span>Keys in file</span><b>${esc(v.keys||0)}</b></div>
      ${rows}
      ${v.ok
        ? `<div class="note good" style="margin-top:14px"><b>This file looks valid.</b>
             Restoring overwrites matching keys in this browser. A safety copy of
             your CURRENT data is taken automatically first, so a mistake is
             recoverable.</div>`
        : `<div class="note bad" style="margin-top:14px"><b>This file failed validation and cannot be restored.</b>
             <ul style="margin:8px 0 0 18px;padding:0">${v.errs.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`}`,
      `<button class="btn" onclick="closeModal()">Cancel</button>
       ${v.ok?`<button class="btn p" id="doRestore">Restore now</button>`:''}`);
    if(v.ok) $('doRestore').onclick = () => {
      const n = Repo.backup.restore(obj);
      closeModal();
      toast(n + ' keys restored. A safety copy of the previous data was saved.', 'good');
      go('data');
    };
  };
  rd.readAsText(file);
}

/* ═══════════════════════════════════════════════════════════════════════════
   GLOBAL SEARCH
   One index built on demand from live data — no cache to invalidate, no
   duplicate listeners, and it cannot go stale.
   ═══════════════════════════════════════════════════════════════════════════ */
function searchAll(q){
  const s = q.toLowerCase().trim();
  if(s.length < 2) return [];
  const out = [];
  Repo.orders.list().forEach(r => {
    const c = r.inv.customer||{};
    if([r.inv.no, c.name, c.mobile, c.email, r.inv.payRef].join(' ').toLowerCase().includes(s))
      out.push({grp:'Orders', icon:'🧾', label:r.inv.no + ' — ' + (c.name||'—'),
                sub:inr(r.inv.grand), act:()=>{go('orders'); setTimeout(()=>viewOrder(r.id), 90);}});
  });
  Repo.customers.list().forEach(c => {
    if([c.name, c.email, c.mobile].join(' ').toLowerCase().includes(s))
      out.push({grp:'Customers', icon:'👤', label:c.name || c.email || c.ownerKey,
                sub:c.orders + ' order' + (c.orders===1?'':'s'), act:()=>{go('customers'); setTimeout(()=>viewCustomer(c.ownerKey), 90);}});
  });
  Repo.products.list().forEach(p => {
    if([p.name, p.brand, p.model, p.id, p.hsn].join(' ').toLowerCase().includes(s))
      out.push({grp:'Products', icon:'🏷', label:p.name, sub:esc(p.model||p.id),
                act:()=>{go('products'); setTimeout(()=>editProduct(p.id), 90);}});
  });
  Repo.coupons.custom().forEach(c => {
    if(c.code.toLowerCase().includes(s))
      out.push({grp:'Coupons', icon:'🎟', label:c.code, sub:c.kind==='pct'?c.value+'%':inr(c.value), act:()=>go('coupons')});
  });
  return out.slice(0, 24);
}
let searchHits = [];
function runSearch(){
  const q = $('gq').value;
  const box = $('gres');
  searchHits = searchAll(q);
  if(!q.trim() || q.trim().length < 2){ box.classList.remove('on'); box.innerHTML = ''; return; }
  if(!searchHits.length){
    box.innerHTML = `<div style="padding:16px;text-align:center;color:var(--dim);font-size:12.5px">
      No matches for “${esc(q)}”</div>`;
    box.classList.add('on'); return;
  }
  let html = '', lastGrp = '';
  searchHits.forEach((h,i) => {
    if(h.grp !== lastGrp){ html += `<div class="rgrp">${h.grp}</div>`; lastGrp = h.grp; }
    html += `<button class="ritem" onclick="pickResult(${i})"><i>${h.icon}</i>
      <span>${esc(h.label)}</span><span class="sub">${h.sub}</span></button>`;
  });
  box.innerHTML = html;
  box.classList.add('on');
}
function pickResult(i){
  const h = searchHits[i]; if(!h) return;

}

/* ═══════════════════════════════════════════════════════════════════════════
   NOTIFICATIONS
   ═══════════════════════════════════════════════════════════════════════════ */
function paintBell(){
  const d = $('ndot');
  if(!d) return;
  let n = 0;
  try{ n = Notify.unseen(); }catch(e){ n = 0; }
  if(n > 0){
    d.textContent = n > 99 ? '99+' : String(n);
    d.style.display = 'grid';
    try{ d.setAttribute('aria-label', n + ' unread notification' + (n===1?'':'s')); }catch(e){}
  } else {
    d.style.display = 'none';
    try{ d.removeAttribute('aria-label'); }catch(e){}
  }
}
let notifList = [];
function openNotifs(){
  notifList = Notify.build();
  const body = notifList.length
    ? notifList.map((n,i)=>`<button class="ritem" style="border-bottom:1px solid #19202f" onclick="pickNotif(${i})">
        <i>${n.icon}</i><span>${esc(n.text)}</span>
        <span class="sub">${n.at?esc(String(n.at).slice(0,10)):''}</span></button>`).join('')
    : emptyState('🔔','Nothing needs attention','New orders, low stock and pending reviews appear here.');
  openModal('Notifications', `<div style="margin:-16px">${body}</div>`,
    `<button class="btn" onclick="closeModal()">Close</button>
     ${notifList.length?`<button class="btn p" onclick="markNotifsRead()">Mark all read</button>`:''}`);
  /* v8: the dot clears on OPEN, which is the requested behaviour — the badge
     answers "is there anything I have not looked at", so opening the panel is
     the act that answers it. v5 deliberately deferred this to an explicit
     button; that is the stricter reading of "dealt with", but it left the dot
     lit after the owner had plainly seen the list.
     "Mark all read" is kept because it still does real work: it acknowledges
     from anywhere in the list without scrolling, and now that seen-state is a
     SET rather than a count, re-acknowledging is idempotent. */
  Notify.markSeen();
}
function markNotifsRead(){
  Notify.markSeen();
  closeModal();
  toast('Notifications marked as read.', 'good');
}
function pickNotif(i){
  const n = notifList[i]; if(!n) return;
  closeModal();
  if(n.go) n.go();
}

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT + SESSION LIFECYCLE
   No polling loops, no observers. Idle timeout is checked on real interaction
   plus ONE low-frequency timer, which is the minimum that can notice an idle
   user who is, by definition, not generating events.
   ═══════════════════════════════════════════════════════════════════════════ */
function doLogin(ev){
  ev.preventDefault();
  const err = $('lgerr');
  const res = Auth.backend.login($('u').value, $('p').value);
  if(!res.ok){
    err.className = 'note bad'; err.textContent = res.msg; err.style.display = 'block';
    $('p').value = '';
    return;
  }
  Auth.start(res.user);
  err.style.display = 'none';
  $('p').value = '';
  enterApp();
}
function enterApp(){
  const u = Auth.session();
  if(!u) return;
  $('login').style.display = 'none';
  $('shell').classList.add('on');
  $('whoName').textContent = u.name || u.username;
  $('whoRole').textContent = Auth.roleLabel();
  $('avatar').textContent = String(u.name||u.username||'A').trim().charAt(0).toUpperCase();
  learnNames();
  paintBell();
  /* Land on the first screen this role may actually open. Sales and Inventory
     staff have no dashboard permission, and sending them to a "not available"
     page on sign-in would be a poor first impression of their own console. */
  const first = NAV.find(n => !n.grp && (n.perm === '*' ? Auth.can('*') : Auth.can(n.perm)));
  go(first ? first.id : 'settings');
}
(function boot(){
  /* First-run guidance: the initial credential is shown ON SCREEN rather than
     hidden in source, because a password nobody can find is not a secret — it
     is a support call. It is changeable from Admin Users immediately. */
  const users = Auth.users();
  if(users.length === 1 && users[0].username === 'owner' && users[0].password === 'raja-admin'){
    const e = $('lgerr');
    e.className = 'note';
    e.innerHTML = 'First run — sign in with <code>owner</code> / <code>raja-admin</code>, then change it in <b>Admin Users</b>.';
    e.style.display = 'block';
  }
  if(Auth.session()) enterApp();

  /* Keep the session alive on genuine use. Passive listeners, one handler each,
     attached once — never re-bound on navigation. */
  ['pointerdown','keydown'].forEach(ev =>
    document.addEventListener(ev, () => { if(Auth.session()) Auth.touch(); }, {passive:true}));

  /* The only timer in the file. 30s is frequent enough to log an idle user out
     promptly and cheap enough to be invisible. */
  setInterval(() => {
    if(!$('shell').classList.contains('on')) return;
    if(!Auth.session()) Auth.logout('Signed out after a period of inactivity.');
    else paintBell();
  }, 30000);

  const gq = $('gq');
  if(gq){
    gq.addEventListener('input', debounce(runSearch, 160));
    gq.addEventListener('focus', runSearch);
  }
  document.addEventListener('click', e => {
    if(!e.target.closest || !e.target.closest('.search')) $('gres').classList.remove('on');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){ closeModal(); $('gres').classList.remove('on'); drawer(false); }
    if((e.ctrlKey||e.metaKey) && e.key === 'k'){ e.preventDefault(); $('gq').focus(); }
  });
  $('modal').addEventListener('click', e => { if(e.target === $('modal')) closeModal(); });
})();
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   v4 — COLOURED SPREADSHEET EXPORT
   ---------------------------------------------------------------------------
   The request was a colour-coded CSV. That cannot exist: .csv is plain text
   with no concept of a fill, a font or a column width, so Excel will always
   render it as undecorated cells no matter what is written into it.

   So exports now offer BOTH:
     · "Excel" — a .xls file in Excel's HTML-table dialect. Excel has opened
       this since 2000 and it carries real styling: coloured headers, banded
       rows, status-coloured cells, right-aligned currency with ₹ formatting,
       frozen header row and sensible column widths.
     · "CSV"   — unchanged, for anything that needs to be machine-read.

   The .xls route is deliberately chosen over a real .xlsx: xlsx is a ZIP of
   XML parts and would need a library, which is a dependency to break for no
   visible gain here.
   ═══════════════════════════════════════════════════════════════════════════ */
const XL = {
  /* Semantic palette, matched to the pills used in the interface so a printed
     sheet reads the same way the screen does. */
  C:{
    head:'#1D3A5E', headText:'#FFFFFF',
    band:'#F4F7FC',
    good:'#E3F9EE', goodText:'#0B6B43',
    warn:'#FFF4E0', warnText:'#8A5200',
    bad:'#FDE7EA',  badText:'#A31423',
    info:'#E7F0FD', infoText:'#12467E',
    money:'#0B3D66',
    dim:'#7A8699'
  },
  /* col: {label, key, type:'text|num|money|date|status', w:px} */
  build(title, subtitle, cols, rows){
    const C = XL.C;
    const th = cols.map(c =>
      `<th style="background:${C.head};color:${C.headText};font-weight:700;font-size:11pt;
        padding:7px 9px;border:1px solid #16304d;text-align:${c.type==='num'||c.type==='money'?'right':'left'};
        white-space:nowrap">${escXl(c.label)}</th>`).join('');

    const body = rows.map((r,i) => {
      const band = i % 2 ? `background:${C.band};` : '';
      return '<tr>' + cols.map(c => {
        const v = r[c.key];
        let style = `padding:5px 9px;border:1px solid #D6DEEA;font-size:10.5pt;${band}`;
        let text = v == null ? '' : String(v);
        let fmt = '';
        if(c.type === 'money'){
          style += `text-align:right;color:${C.money};font-weight:600;`;
          fmt = ' x:num="' + (Number(v)||0) + '"';
          text = Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2, maximumFractionDigits:2});
        } else if(c.type === 'num'){
          style += 'text-align:right;';
          fmt = ' x:num="' + (Number(v)||0) + '"';
        } else if(c.type === 'status'){
          const k = XL.statusKey(text);
          style += `background:${C[k]};color:${C[k+'Text']};font-weight:700;text-align:center;`;
        } else if(c.type === 'dim'){
          style += `color:${C.dim};`;
        }
        return `<td style="${style}"${fmt}>${escXl(text)}</td>`;
      }).join('') + '</tr>';
    }).join('');

    /* Column widths and a frozen header come from Excel's own XML island. */
    const widths = cols.map(c => `<col width="${c.w||120}">`).join('');
    return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
      xmlns:x="urn:schemas-microsoft-com:office:excel"
      xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">
      <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
      <x:Name>${escXl(title).slice(0,31)}</x:Name><x:WorksheetOptions>
      <x:FreezePanes/><x:FrozenNoSplit/><x:SplitHorizontalPosition>3</x:SplitHorizontalPosition>
      <x:TopRowBottomPane>3</x:TopRowBottomPane><x:ActivePane>2</x:ActivePane>
      <x:Print><x:ValidPrinterInfo/><x:FitWidth>1</x:FitWidth></x:Print>
      </x:WorksheetOptions></x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
      <style>td,th{vertical-align:middle;font-family:Calibri,Arial,sans-serif}</style>
      </head><body>
      <table border="0" cellspacing="0" cellpadding="0">
        <colgroup>${widths}</colgroup>
        <tr><td colspan="${cols.length}" style="font-size:16pt;font-weight:700;color:${C.head};padding:10px 9px 2px">
          RAJA ELECTRONICS — ${escXl(title)}</td></tr>
        <tr><td colspan="${cols.length}" style="font-size:10pt;color:${C.dim};padding:0 9px 10px">
          ${escXl(subtitle||'')} · generated ${new Date().toLocaleString('en-IN')}</td></tr>
        <tr>${th}</tr>
        ${body}
        <tr><td colspan="${cols.length}" style="height:6px"></td></tr>
        ${XL.totalsRow(cols, rows)}
      </table></body></html>`;
  },
  statusKey(t){
    const s = String(t).toLowerCase();
    if(/deliver|active|paid|healthy|approved|yes|in stock/.test(s)) return 'good';
    if(/cancel|out of stock|blocked|expired|reject|failed|no$/.test(s)) return 'bad';
    if(/low|pending|packed|ship|out for|await|inactive/.test(s)) return 'warn';
    return 'info';
  },
  /* A totals row for numeric and money columns, because a shop owner opening a
     sheet almost always wants the bottom line without writing a formula. */
  totalsRow(cols, rows){
    const C = XL.C;
    const any = cols.some(c => c.type === 'money' || c.type === 'num');
    if(!any || !rows.length) return '';
    return '<tr>' + cols.map((c,i) => {
      if(i === 0) return `<td style="background:${C.head};color:#fff;font-weight:700;padding:6px 9px;border:1px solid #16304d">TOTAL (${rows.length})</td>`;
      if(c.type === 'money' || c.type === 'num'){
        const sum = rows.reduce((s,r) => s + (Number(r[c.key])||0), 0);
        return `<td style="background:${C.head};color:#fff;font-weight:700;text-align:right;padding:6px 9px;border:1px solid #16304d" x:num="${sum}">${
          c.type==='money' ? sum.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}) : sum.toLocaleString('en-IN')}</td>`;
      }
      return `<td style="background:${C.head};border:1px solid #16304d"></td>`;
    }).join('') + '</tr>';
  }
};
function escXl(s){ return String(s==null?'':s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* One entry point every screen uses, so a new report gets colour for free. */
function exportExcel(stem, title, subtitle, cols, rows){
  const html = XL.build(title, subtitle, cols, rows);
  dl(stem + '-' + new Date().toISOString().slice(0,10) + '.xls', html, 'application/vnd.ms-excel');
  toast(rows.length + ' rows exported for Excel.', 'good');
  Audit.log('export.excel', stem, '', rows.length + ' rows');
}
/* Plain CSV derived from the same column spec — one definition, two formats. */
function exportCsvCols(stem, cols, rows){
  const out = [cols.map(c => c.label)];
  rows.forEach(r => out.push(cols.map(c => r[c.key])));
  exportCsv(stem, out);
}

/* ═══════════════════════════════════════════════════════════════════════════
   v4 — SOLD UNITS REGISTER
   ---------------------------------------------------------------------------
   Every unit the shop bills is recorded in the stock ledger with its serial,
   model and invoice, and each invoice carries the purchase date and warranty
   term. Neither alone answers "is this serial still under warranty?", so the
   two are joined here and made searchable — which is the question a counter
   actually gets asked when a customer walks in with a faulty item.
   ═══════════════════════════════════════════════════════════════════════════ */
function warrantyMonths(text){
  const t = String(text||'').toLowerCase();
  if(!t) return 0;
  /* "1+9 Year" means 1 year comprehensive plus 9 on the compressor — the
     meaningful cover for a warranty lookup is the first figure. */
  const plus = t.match(/(\d+)\s*\+\s*(\d+)\s*year/);
  if(plus) return parseInt(plus[1],10)*12;
  const y = t.match(/(\d+(?:\.\d+)?)\s*year/);
  if(y) return Math.round(parseFloat(y[1])*12);
  const m = t.match(/(\d+)\s*month/);
  if(m) return parseInt(m[1],10);
  return 0;
}
function addMonths(iso, months){
  if(!iso || !months) return '';
  const d = new Date(iso + 'T00:00:00Z');
  if(isNaN(d)) return '';
  d.setUTCMonth(d.getUTCMonth() + months);
  return d.toISOString().slice(0,10);
}
function soldUnits(){
  /* Index invoices by number so a serial can be traced to its bill in one pass
     rather than a nested scan per unit. */
  const byNo = {};
  Repo.orders.list().forEach(r => { if(r.inv && r.inv.no) byNo[String(r.inv.no)] = r; });
  const prods = Repo.products.list();
  const byModel = {}; prods.forEach(p => { if(p.model) byModel[String(p.model).trim()] = p; });

  const out = [];
  Repo.stock.rows().forEach(row => {
    row.units.forEach(u => {
      const invNo = String(u.invoice || u.no || '');
      const ord = byNo[invNo] || null;
      const inv = ord ? ord.inv : null;
      const line = inv ? (inv.items||[]).find(it =>
        String(it.serial||'') === String(u.serial||'') ||
        String(it.model||'').trim() === String(u.model||'').trim()) : null;

      const prod = Repo.products.get(row.id) || byModel[String(u.model||'').trim()] || null;
      const soldOn = inv ? (inv.purchaseDate && /^\d{4}-\d{2}-\d{2}$/.test(inv.purchaseDate)
                            ? inv.purchaseDate : dayOf(inv))
                         : String(u.at||'').slice(0,10);
      const wText = (line && line.warranty) || (inv && inv.warranty) || (prod && prod.warranty) || '';
      const months = warrantyMonths(wText);
      const expiry = addMonths(soldOn, months);
      let days = null, state = 'unknown';
      if(expiry){
        days = Math.round((new Date(expiry+'T00:00:00Z') - new Date(todayKey()+'T00:00:00Z'))/86400000);
        state = days < 0 ? 'expired' : days <= 30 ? 'expiring' : 'active';
      }
      out.push({
        serial: u.serial || '—',
        model: u.model || (prod && prod.model) || '—',
        productId: row.id,
        product: (prod && prod.name) || productName(row.id),
        brand: (prod && prod.brand) || '',
        invoice: invNo || '—',
        customer: inv ? ((inv.customer&&inv.customer.name) || '—') : '—',
        mobile: inv ? ((inv.customer&&inv.customer.mobile) || '') : '',
        soldOn, warranty: wText || '—', months, expiry: expiry || '—',
        days, state, price: line ? (+(line.price||line.rate)||0) : 0,
        orderId: ord ? ord.id : null
      });
    });
  });
  out.sort((a,b) => String(b.soldOn||'').localeCompare(String(a.soldOn||'')));
  return out;
}

let suq = '', sufil = 'all';
VIEWS.sold = function(){

  `${noProducts ? `<div class="note warn" style="margin-bottom:14px"><b>Import the catalogue for full detail.</b>

  <div class="kpis">

  </div>
  <div class="panel">
    <div class="ph"><h3>${rows.length} unit${rows.length===1?'':'s'}</h3>
      <span class="sub">newest sale first</span></div>
    ${rows.length ? `<div class="tw"><table>
      <thead><tr><th>Serial no.</th><th>Product</th><th>Brand</th><th>Model</th>
        <th>Sold on</th><th>Warranty</th><th>Expires</th><th class="r">Days left</th>
        <th>Invoice</th><th>Customer</th><th></th></tr></thead>
      <tbody>${rows.slice(0,400).map(u=>`<tr>
        <td class="mono"><b>${esc(u.serial)}</b></td>
        <td>${esc(u.product)}<div style="color:var(--dim);font-size:11px" class="mono">${esc(u.productId)}</div></td>
        <td>${esc(u.brand||'—')}</td>
        <td class="mono">${esc(u.model)}</td>
        <td class="mono nw">${esc(u.soldOn||'—')}</td>
        <td class="nw">${esc(u.warranty)}</td>
        <td class="mono nw">${esc(u.expiry)}</td>
        <td class="r nw">${u.days==null?'<span class="pill n">unknown</span>'
          : u.state==='expired' ? `<span class="pill b">expired ${Math.abs(u.days)}d ago</span>`
          : u.state==='expiring' ? `<span class="pill o">${u.days} days</span>`
          : `<span class="pill g">${u.days} days</span>`}</td>
        <td class="mono nw">${esc(u.invoice)}</td>

        <td class="nw">${u.orderId?`<button class="btn sm" onclick="viewInvoiceDoc('${attr(u.orderId)}')">Invoice</button>`:''}</td>
      </tr>`).join('')}</tbody></table></div>
      ${rows.length>400?`<div class="pb" style="color:var(--dim);font-size:12px">Showing the first 400 — narrow the search or export for the full list.</div>`:''}`
      : emptyState('🔎','No units match','Serial numbers are recorded as the shop bills each item.')}
  </div>`;
};

function setSufil(f){ sufil = f; go('sold'); }
const SOLD_COLS = [
  {label:'Serial No.', key:'serial', w:130},

/* ═══════════════════════════════════════════════════════════════════════════
   v4 — INVOICE DOCUMENT
   ---------------------------------------------------------------------------
   The shop builds its PDFs on demand with html2canvas and never stores a file,
   so there is no document to attach. What it DOES store is every field the
   document is made of. So the bill is re-rendered here from that data — the
   same information, laid out as an invoice, and printable to PDF through the
   browser's own print dialog. That is honest: it is a faithful rendering, not a
   retrieved file, and it needs no library.
   ═══════════════════════════════════════════════════════════════════════════ */
const SHOP_INFO = {

/* ═══════════════════════════════════════════════════════════════════════════
   v4 — ACCESSIBILITY & APPEARANCE
   ---------------------------------------------------------------------------
   Applied by writing CSS custom properties and data-attributes on <html>, so
   one function changes the whole console and nothing has to re-render. Choices
   persist per browser.
   ═══════════════════════════════════════════════════════════════════════════ */
const A11Y_KEY = 'admin_a11y';
const A11Y_DEFAULT = {scale:100, density:'comfortable', contrast:false, motion:false, speak:false, underline:false};
function a11y(){ return Object.assign({}, A11Y_DEFAULT, DB.get(A11Y_KEY, {}) || {}); }
function applyA11y(){
  const a = a11y(), r = document.documentElement;
  if(!r || !r.style) return;

  /* ═══ v5: WHY THE TEXT SIZE CONTROL DID NOTHING ═════════════════════════
     The previous version set `html { font-size: N% }`. That only cascades to
     lengths written in rem/em — and this stylesheet is written almost entirely
     in fixed px (275 of them). Percentage root sizing has no effect on a px
     value, so A+ and A− changed the root and nothing visible moved. My mistake,
     and it was never going to work as written.

     Rewriting 275 declarations into rem would be a large, risky edit across
     every screen. Scaling the whole interface is both simpler and better for
     accessibility, because it enlarges padding, icons, table cells and controls
     together rather than leaving text growing inside boxes that stay put.

     `zoom` is used where supported (Chrome, Edge, Safari, and Firefox since
     v126) because unlike a transform it re-flows the layout, so the sidebar and
     tables stay correctly sized instead of being visually stretched. The
     transform path is a fallback for older Firefox, with a width correction so
     the page does not overflow horizontally. */
  const pct = Math.max(75, Math.min(160, +a.scale||100));
  const body = document.body;
  if(body && body.style){
    if(pct === 100){
      body.style.zoom = '';
      body.style.transform = '';
      body.style.transformOrigin = '';
      body.style.width = '';
    } else if('zoom' in body.style){
      body.style.zoom = pct + '%';
      body.style.transform = '';
      body.style.width = '';
    } else {
      const f = pct/100;
      body.style.transform = 'scale(' + f + ')';
      body.style.transformOrigin = '0 0';
      body.style.width = (100/f) + '%';
    }
  }
  /* Kept as well, so anything authored in rem follows too. */
  r.style.fontSize = pct + '%';
  r.setAttribute('data-density', a.density);
  r.setAttribute('data-contrast', a.contrast ? 'high' : 'normal');
  r.setAttribute('data-motion', a.motion ? 'reduced' : 'normal');
  r.setAttribute('data-underline', a.underline ? 'on' : 'off');
}
function setA11y(patch){
  const next = Object.assign(a11y(), patch);
  DB.set(A11Y_KEY, next);
  applyA11y();
}
function bumpFont(delta){
  const a = a11y();
  const next = Math.max(75, Math.min(160, (+a.scale||100) + delta));
  if(next === a.scale) return toast(delta > 0 ? 'Already at the largest size.' : 'Already at the smallest size.');
  setA11y({scale:next});
  toast('Text size ' + next + '%.', 'good');
  if(cur === 'settings') go('settings');
}

/* Read-aloud. Opt-in, and it reads what the pointer lands on rather than
   narrating everything — a console that talks constantly is unusable. */
let speakOn = false, lastSpoken = '';
/* ═══ v5: WHY READ-ALOUD WAS SILENT ══════════════════════════════════════
   getVoices() returns an EMPTY array on first call in every major browser —
   the voice list loads asynchronously and fires `voiceschanged` when ready. The
   previous version never waited for it and never picked a voice, so on a
   machine where the default voice was not yet resolved the utterance was
   queued against nothing and no sound came out.

   Now: voices are cached on `voiceschanged`, an explicit voice is chosen
   (preferring an Indian English one, then any English), and if the list is
   still empty the utterance is deferred until it arrives rather than dropped.
   `resume()` is called because Chrome parks the queue when a tab has been
   backgrounded, which silently swallows everything spoken afterwards. */
let _voices = [], _pending = null;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  try{
    _voices = window.speechSynthesis.getVoices() || [];
    if(_voices.length && _pending){ const t = _pending; _pending = null; speakText(t); }
  }catch(e){}
}
function pickVoice(){
  if(!_voices.length) return null;
  return _voices.find(v => /^en[-_]IN/i.test(v.lang))
      || _voices.find(v => /^en[-_]GB/i.test(v.lang))
      || _voices.find(v => /^en/i.test(v.lang))
      || _voices[0];
}
function speakText(t){
  if(!speakOn || !t || !('speechSynthesis' in window)) return;
  t = String(t).replace(/\s+/g,' ').trim().slice(0, 240);
  if(!t || t === lastSpoken) return;
  lastSpoken = t;
  try{
    const synth = window.speechSynthesis;
    if(!_voices.length){ loadVoices(); }
    if(!_voices.length){ _pending = t; return; }   /* wait for voiceschanged */
    synth.cancel();
    synth.resume();                                /* Chrome parks the queue */
    const u = new SpeechSynthesisUtterance(t);
    const v = pickVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-IN';
    u.rate = 1; u.pitch = 1; u.volume = 1;
    synth.speak(u);
  }catch(e){}
}
function speechAvailable(){
  return ('speechSynthesis' in window) && (_voices.length > 0 || !!window.speechSynthesis);
}
function initSpeak(){
  speakOn = !!a11y().speak;
  if(initSpeak._bound) return;
  initSpeak._bound = true;
  loadVoices();
  try{
    if(window.speechSynthesis && 'onvoiceschanged' in window.speechSynthesis)
      window.speechSynthesis.addEventListener('voiceschanged', loadVoices);
  }catch(e){}
  /* One delegated listener, attached once. Never re-bound on navigation. */
  document.addEventListener('pointerover', e => {
    if(!speakOn) return;
    const t = e.target.closest && e.target.closest('button,a,th,td,.kpi,.note,label,h2,h3');
    if(!t) return;
    speakText(t.getAttribute('aria-label') || t.innerText || t.textContent);
  }, {passive:true});
  document.addEventListener('focusin', e => {
    if(!speakOn) return;
    const t = e.target;
    if(t && t.matches && t.matches('input,select,textarea,button')){
      const lab = t.closest('.fld') ? t.closest('.fld').querySelector('label') : null;
      speakText((lab ? lab.textContent + '. ' : '') + (t.getAttribute('placeholder') || t.value || t.textContent || ''));
    }
  });
}
function toggleSpeak(){
  const on = !a11y().speak;
  setA11y({speak:on});
  speakOn = on;
  if(!on){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  toast(on ? 'Read-aloud on — point at anything to hear it.' : 'Read-aloud off.', 'good');
  if(on) speakText('Read aloud is on.');
  if(cur === 'settings') go('settings');
}

   SETTINGS — rebuilt with appearance, accessibility and shop details

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   v5 — REVIEW SUBMISSION DATE
   ---------------------------------------------------------------------------
   The customer site does not write one field consistently: shop reviews carry
   `at` (ISO), product reviews sometimes carry `date` (display string), and older
   entries carry neither. So rather than slicing whichever happens to exist —
   which produced blanks and half-parsed strings — every known shape is tried in
   order and the result is rendered as a readable date plus time where the
   record has one.
   ═══════════════════════════════════════════════════════════════════════════ */
function reviewWhen(r){
  const raw = r && (r.at || r.date || r.createdAt || r.time || r.ts);
  if(!raw) return '<span style="color:var(--dim)">not recorded</span>';

  let d = null;
  const str = String(raw).trim();

  if(/^\d{13}$/.test(str)) d = new Date(+str);                    /* epoch ms   */
  else if(/^\d{10}$/.test(str)) d = new Date(+str * 1000);        /* epoch secs */
  else if(/^\d{4}-\d{2}-\d{2}/.test(str)) d = new Date(str.length > 10 ? str : str + 'T00:00:00');
  else {
    const m = str.match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);     /* dd-mm-yyyy */
    if(m) d = new Date(m[3] + '-' + m[2] + '-' + m[1] + 'T00:00:00');
  }
  if(!d || isNaN(d)) return '<span class="mono">' + esc(str.slice(0,16)) + '</span>';

  const day = d.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  const hasTime = /[T ]\d{2}:\d{2}/.test(str) || /^\d{10,13}$/.test(str);
  const time = hasTime ? d.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) : '';

  /* A relative hint is what an owner actually scans for — "was this today?" */
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  const rel = days < 0 ? '' : days === 0 ? 'today' : days === 1 ? 'yesterday'
            : days < 30 ? days + ' days ago'
            : days < 365 ? Math.floor(days/30) + ' month' + (days<60?'':'s') + ' ago'
            : Math.floor(days/365) + ' year' + (days<730?'':'s') + ' ago';

  return '<span class="mono">' + esc(day) + '</span>' +
         (time ? '<div style="color:var(--dim);font-size:10.5px" class="mono">' + esc(time) + '</div>' : '') +
         (rel  ? '<div style="color:var(--dim);font-size:10.5px">' + esc(rel) + '</div>' : '');
}

/* ═══════════════════════════════════════════════════════════════════════════
   v5 — SEMANTIC CHART COLOURS
   ---------------------------------------------------------------------------
   A single-colour bar chart makes the reader compare heights to work out what
   is good. Colouring by performance means a glance is enough: green a strong
   day, blue an ordinary one, amber slack, red near-nothing.

   The thresholds are RELATIVE to the period's own average rather than fixed
   rupee amounts, so the same rule reads correctly for a shop turning over
   ₹5,000 a day and one turning over ₹5,00,000.
   ═══════════════════════════════════════════════════════════════════════════ */
function barColour(value, avg){
  if(!value) return {c:'#243049', label:'no sales'};
  if(!avg)   return {c:'#4c9aff', label:'sales'};
  const r = value / avg;
  if(r >= 1.25) return {c:'#3ddc97', label:'strong — above average'};
  if(r >= 0.75) return {c:'#4c9aff', label:'steady — around average'};
  if(r >= 0.40) return {c:'#ffb454', label:'slow — below average'};
  return {c:'#ff5c6c', label:'very low'};
}
function chartLegend(){
  return `<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--muted)">
    <span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#3ddc97;display:inline-block"></i>Strong</span>
    <span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#4c9aff;display:inline-block"></i>Steady</span>
    <span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#ffb454;display:inline-block"></i>Slow</span>
    <span style="display:flex;align-items:center;gap:5px"><i style="width:9px;height:9px;border-radius:2px;background:#ff5c6c;display:inline-block"></i>Very low</span>
    <span style="color:var(--dim);margin-left:auto">compared with the average for this period</span>
  </div>`;
}
/* Renders a full coloured bar chart from {label, value} pairs. */
function colouredBars(series, fmtVal){
  const vals = series.map(s => s.value);
  const peak = Math.max(1, ...vals);
  const nonZero = vals.filter(v => v > 0);
  const avg = nonZero.length ? nonZero.reduce((a,b)=>a+b,0)/nonZero.length : 0;
  const f = fmtVal || inr;
  return `<div class="bars">${series.map(s => {
    const col = barColour(s.value, avg);
    return `<div class="col" title="${esc(s.label)} — ${f(s.value)} (${col.label})">
      <i style="height:${Math.max(s.value?3:0, Math.round(s.value/peak*100))}%;background:${col.c}"></i></div>`;
  }).join('')}</div>
  <div class="axis"><span>${esc(series[0]?series[0].label:'')}</span>
    <span style="color:var(--muted)">avg ${f(Math.round(avg))}</span>
    <span>${esc(series.length?series[series.length-1].label:'')}</span></div>
  ${chartLegend()}`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   v5 — VOICE DIAGNOSTIC
   Reports what the OS actually provides, because silence is almost always a
   missing system voice rather than a coding fault, and guessing wastes time.
   ═══════════════════════════════════════════════════════════════════════════ */
function testVoice(){
  const info = $('voiceInfo');
  if(!('speechSynthesis' in window)){
    if(info) info.innerHTML = '<span style="color:var(--bad)">This browser has no speech engine.</span>';
    return toast('Speech is not supported here.', 'bad');
  }
  loadVoices();
  const say = () => {
    const v = pickVoice();
    if(info){
      info.innerHTML = _voices.length
        ? 'Using <b>' + esc(v ? v.name : 'default') + '</b> (' + esc(v ? v.lang : '—') + ') · ' +
          _voices.length + ' voice' + (_voices.length===1?'':'s') + ' installed'
        : '<span style="color:var(--warn)">No voices installed. Add one in your operating system\'s ' +
          'speech settings, then reload this page.</span>';
    }
    lastSpoken = '';
    speakText('Read aloud is working. This is the Raja Electronics admin console.');
  };
  if(_voices.length) say();
  else setTimeout(() => { loadVoices(); say(); }, 400);  /* give the list a beat to arrive */
}
</script>

<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   v6 — READABLE WORKBOOK EXPORT + PER-CUSTOMER DATA EXPORT
   ---------------------------------------------------------------------------
   A note on the file format, because the request was for ".xlsx".

   A genuine .xlsx is a ZIP archive containing a set of XML parts (workbook,
   worksheets, sharedStrings, styles, relationships) and cannot be produced
   without a ZIP writer — which means bundling a library into this file. What is
   produced instead is Excel's own SpreadsheetML workbook format, saved as .xls.
   Excel, LibreOffice and Google Sheets all open it natively, and crucially it
   supports the things that actually make data readable:

       · MULTIPLE SHEETS in one file, one per data type
       · coloured headers, banded rows, semantic status colours
       · real numbers Excel can sum and sort (not text)
       · frozen header rows and sensible column widths

   The previous JSON backup is kept and is still the ONLY format that can be
   restored, because a spreadsheet loses the exact structure a restore needs.
   The workbook is for reading and sharing; the JSON is for recovery. Both are
   offered, and the screen says which is which.
   ═══════════════════════════════════════════════════════════════════════════ */

/* A multi-sheet workbook. Each sheet reuses the same {label,key,type} column
   spec the single-sheet exporter uses, so nothing is defined twice. */
function buildWorkbook(sheets){
  const C = XL.C;
  const names = sheets.map(sh => sh.name.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31));

  const body = sheets.map((sh, si) => {
    const cols = sh.cols, rows = sh.rows;
    const th = cols.map(c =>
      `<th style="background:${C.head};color:${C.headText};font-weight:700;font-size:11pt;
        padding:7px 9px;border:1px solid #16304d;
        text-align:${c.type==='num'||c.type==='money'?'right':'left'};white-space:nowrap">${escXl(c.label)}</th>`).join('');

    const trs = rows.map((r,i) => {
      const band = i % 2 ? `background:${C.band};` : '';
      return '<tr>' + cols.map(c => {
        const v = r[c.key];
        let style = `padding:5px 9px;border:1px solid #D6DEEA;font-size:10.5pt;${band}`;
        let text = v == null ? '' : String(v), num = '';
        if(c.type === 'money'){
          style += `text-align:right;color:${C.money};font-weight:600;`;
          num = ' x:num="' + (Number(v)||0) + '"';
          text = Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
        } else if(c.type === 'num'){
          style += 'text-align:right;';
          num = ' x:num="' + (Number(v)||0) + '"';
        } else if(c.type === 'status'){
          const k = XL.statusKey(text);
          style += `background:${C[k]};color:${C[k+'Text']};font-weight:700;text-align:center;`;
        } else if(c.type === 'dim'){
          style += `color:${C.dim};`;
        } else if(c.type === 'wrap'){
          style += 'white-space:normal;';
        }
        return `<td style="${style}"${num}>${escXl(text)}</td>`;
      }).join('') + '</tr>';
    }).join('');

    return `<table border="0" cellspacing="0" cellpadding="0">
      <colgroup>${cols.map(c=>`<col width="${c.w||120}">`).join('')}</colgroup>
      <tr><td colspan="${cols.length}" style="font-size:15pt;font-weight:700;color:${C.head};padding:9px 9px 2px">
        ${escXl(sh.title || sh.name)}</td></tr>
      <tr><td colspan="${cols.length}" style="font-size:10pt;color:${C.dim};padding:0 9px 9px">
        ${escXl(sh.subtitle||'')}${sh.subtitle?' · ':''}${rows.length} row${rows.length===1?'':'s'}</td></tr>
      <tr>${th}</tr>
      ${trs || `<tr><td colspan="${cols.length}" style="padding:14px 9px;color:${C.dim}">No records.</td></tr>`}
      ${rows.length ? XL.totalsRow(cols, rows) : ''}
    </table>`;
  });

  /* Excel takes one sheet per top-level <table> when the worksheet names are
     declared in the XML island below, in the same order. */
  const sheetXml = names.map(n => `<x:ExcelWorksheet><x:Name>${escXl(n)}</x:Name>
    <x:WorksheetOptions><x:FreezePanes/><x:FrozenNoSplit/>
    <x:SplitHorizontalPosition>3</x:SplitHorizontalPosition>
    <x:TopRowBottomPane>3</x:TopRowBottomPane><x:ActivePane>2</x:ActivePane>
    <x:Print><x:ValidPrinterInfo/><x:FitWidth>1</x:FitWidth></x:Print>
    </x:WorksheetOptions></x:ExcelWorksheet>`).join('');

  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel"
    xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">
    <!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>${sheetXml}
    </x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
    <style>td,th{vertical-align:middle;font-family:Calibri,Arial,sans-serif}
    br{mso-data-placement:same-cell}</style></head><body>
    ${body.join('\n')}
    </body></html>`;
}

/* ── Column specs, defined once and shared by the workbook and the CSVs ── */
const WB_COLS = {
  orders:[
    {label:'Invoice No.', key:'no', w:115},
    {label:'Order Date', key:'date', w:95},
    {label:'Time', key:'time', w:70},
    {label:'Customer Name', key:'cust', w:170},
    {label:'Mobile', key:'mobile', w:115},
    {label:'Email', key:'email', w:200},
    {label:'Products Purchased', key:'products', type:'wrap', w:300},
    {label:'Total Units', key:'units', type:'num', w:80},
    {label:'Payment Method', key:'payment', w:120},
    {label:'Payment Status', key:'paid', type:'status', w:110},
    {label:'Order Status', key:'status', type:'status', w:130},
    {label:'Subtotal', key:'sub', type:'money', w:110},
    {label:'Discount', key:'disc', type:'money', w:105},
    {label:'GST', key:'gst', type:'money', w:105},
    {label:'Delivery', key:'delivery', type:'money', w:100},
    {label:'Grand Total', key:'grand', type:'money', w:120}
  ],

/* ── Row builders, each independent so a sheet can be exported on its own ── */
const WB_ROWS = {
  orders(list){
    return (list || Repo.orders.list()).map(r => {
      const v = r.inv, c = v.customer||{}, it = v.items||[];
      return {no:v.no, date:v.date, time:v.time, cust:c.name||'', mobile:c.mobile||'', email:c.email||'',
        products: it.map(i => (i.name||'') + (i.model?' [' + i.model + ']':'') + ' x' + (i.qty||1)).join('\n'),
        units: it.reduce((s,i)=>s+(+i.qty||0),0),
        payment:v.payment||'', paid: v.payRef ? 'Paid' : 'Pending',
        status: Repo.orders.status(v), sub:v.sub,
        disc:(+v.discount||0)+(+v.couponAmt||0), gst:v.gstAmt, delivery:v.delivery, grand:v.grand};
    });
  },
  customers(list){
    const orders = Repo.orders.list();
    return (list || Repo.customers.list()).map(c => {
      const mine = orders.filter(r => String(r.owner||'').toLowerCase() === c.ownerKey);
      const dates = mine.map(r => dayOf(r.inv)).filter(Boolean).sort();
      return {name:c.name||'', email:c.email||'', mobile:c.mobile||'',
        reg: c.implicit ? 'Guest' : 'Registered', orders:c.orders, spend:c.spend,
        avg: c.orders ? c.spend/c.orders : 0,
        first: dates[0]||'', last: dates[dates.length-1]||'',
        status: c.blocked ? 'Blocked' : 'Active'};
    });
  },
  products(){
    const led = Repo.stock.ledger();
    return Repo.products.list().map(p => ({
      id:p.id, name:p.name, brand:p.brand||'', model:p.model||'', cat:p.cat||'', hsn:p.hsn||'',
      price:p.price, old:p.old,
      disc:(p.old && p.old > p.price) ? Math.round((p.old-p.price)/p.old*100) : 0,
      gst:p.gst, warranty:p.warranty||'',
      stock: led[p.id] ? (+led[p.id].qty||0) : (+p.stock||0),
      status: p.active === false ? 'Inactive' : 'Active'}));
  },
  inventory(){
    return Repo.stock.rows().map(r => { const p = Repo.products.get(r.id) || {};
      return {id:r.id, name:p.name||productName(r.id), brand:p.brand||'', model:p.model||'',
        qty:r.qty, sold:r.sold, price:+p.price||0, value:(+p.price||0)*r.qty,
        status: r.state==='out'?'Out of stock' : r.state==='low'?'Low stock' : 'Healthy'}; });
  },
  units(list){
    return (list || soldUnits()).map(u => Object.assign({}, u, {
      stateLabel: u.state==='active' ? 'Under warranty' : u.state==='expiring' ? 'Expiring soon'
                : u.state==='expired' ? 'Out of warranty' : 'Unknown'}));
  },
  reviews(list){
    return (list || Repo.reviews.list()).map(x => ({
      when: String(x.r.at || x.r.date || '').slice(0,16).replace('T',' ') || 'not recorded',
      target:x.target, author:x.r.name || x.r.author || '',
      rating: +x.r.stars || +x.r.rating || 0,
      text: String(x.r.text || x.r.body || ''),
      reply: String(x.r.reply || ''),
      answered: x.r.reply ? 'Replied' : 'Awaiting reply'}));
  },
  coupons(){
    const today = todayKey();
    return Repo.coupons.custom().map(c => ({
      code:c.code, kind: c.kind==='pct' ? 'Percentage' : 'Fixed amount', value:c.value,
      min:c.min, cap:c.cap, expires:c.expires||'', used:+c.used||0, limit:+c.limit||0,
      status: !c.active ? 'Inactive'
            : (c.expires && c.expires < today) ? 'Expired'
            : (c.limit && (+c.used||0) >= +c.limit) ? 'Used up' : 'Active'}));
  },
  audit(){
    return Audit.list().map(a => ({
      at: String(a.at||'').slice(0,16).replace('T',' '),
      name:a.name||a.by||'', role: ROLES[a.role] ? ROLES[a.role].label : (a.role||''),
      action:a.action, record:a.record, before:a.before, after:a.after}));
  }
};

/* ── Full workbook: every sheet ── */
function exportWorkbook(){
  const stamp = new Date().toLocaleString('en-IN');
  const sheets = [
    {name:'Orders',     title:'Orders & Invoices',     subtitle:stamp, cols:WB_COLS.orders,    rows:WB_ROWS.orders()},
    {name:'Customers',  title:'Customers',             subtitle:stamp, cols:WB_COLS.customers, rows:WB_ROWS.customers()},
    {name:'Products',   title:'Product Catalogue',     subtitle:stamp, cols:WB_COLS.products,  rows:WB_ROWS.products()},
    {name:'Inventory',  title:'Stock On Hand',         subtitle:stamp, cols:WB_COLS.inventory, rows:WB_ROWS.inventory()},
    {name:'Sold Units', title:'Serial & Warranty',     subtitle:stamp, cols:WB_COLS.units,     rows:WB_ROWS.units()},
    {name:'Reviews',    title:'Reviews & Replies',     subtitle:stamp, cols:WB_COLS.reviews,   rows:WB_ROWS.reviews()},
    {name:'Coupons',    title:'Coupons',               subtitle:stamp, cols:WB_COLS.coupons,   rows:WB_ROWS.coupons()},
    {name:'Activity',   title:'Activity Log',          subtitle:stamp, cols:WB_COLS.audit,     rows:WB_ROWS.audit()}
  ];
  dl('raja-full-data-' + new Date().toISOString().slice(0,10) + '.xls',
     buildWorkbook(sheets), 'application/vnd.ms-excel');
  const total = sheets.reduce((s,x)=>s+x.rows.length,0);
  toast(sheets.length + ' sheets, ' + total + ' rows exported.', 'good');
  Audit.log('export.workbook', sheets.length + ' sheets', '', total + ' rows');
}

/* ═══════════════════════════════════════════════════════════════════════════
   PER-CUSTOMER EXPORT
   Everything the shop holds about ONE person, in one workbook: their profile,
   every order, every line item they bought, every serial they own with warranty
   status, and every review they left. This is also what to send someone who
   asks what data you hold on them.
   ═══════════════════════════════════════════════════════════════════════════ */
function exportCustomerData(ownerKey){
  const c = Repo.customers.list().find(x => x.ownerKey === ownerKey);
  if(!c) return toast('That customer no longer exists.', 'bad');

  const orders = Repo.orders.list().filter(r => String(r.owner||'').toLowerCase() === ownerKey);
  const invNos = new Set(orders.map(r => String(r.inv.no)));
  const units  = soldUnits().filter(u => invNos.has(String(u.invoice)));
  const name   = String(c.name || c.email || ownerKey).toLowerCase();
  const revs   = Repo.reviews.list().filter(x =>
    String(x.r.name || x.r.author || '').toLowerCase() === name);

  /* Line-item detail: what they actually bought, not just order totals. */
  const lineCols = [
    {label:'Invoice No.', key:'no', w:115},
    {label:'Order Date', key:'date', w:95},
    {label:'Product', key:'name', type:'wrap', w:280},
    {label:'Model No.', key:'model', w:135},
    {label:'Serial No.', key:'serial', w:135},
    {label:'Qty', key:'qty', type:'num', w:65},
    {label:'Unit Price', key:'price', type:'money', w:115},
    {label:'Line Total', key:'total', type:'money', w:120}
  ];
  const lines = [];
  orders.forEach(r => (r.inv.items||[]).forEach(it => lines.push({
    no:r.inv.no, date:r.inv.date, name:it.name||'', model:it.model||'', serial:it.serial||'',
    qty:+it.qty||0, price:+(it.price||it.rate)||0,
    total:(+it.qty||0)*(+(it.price||it.rate)||0)
  })));

  const profileCols = [{label:'Field', key:'k', w:190},{label:'Value', key:'v', type:'wrap', w:340}];
  const dates = orders.map(r => dayOf(r.inv)).filter(Boolean).sort();
  const profile = [
    {k:'Customer name', v:c.name||'—'},
    {k:'Email', v:c.email||'—'},
    {k:'Mobile', v:c.mobile||'—'},
    {k:'Account type', v:c.implicit ? 'Guest (not registered)' : 'Registered account'},
    {k:'Account status', v:c.blocked ? 'Blocked' : 'Active'},
    {k:'Total orders', v:String(orders.length)},
    {k:'Lifetime spend', v:inr(c.spend)},
    {k:'Average order value', v:inr(c.orders ? c.spend/c.orders : 0)},
    {k:'First order', v:dates[0] || '—'},
    {k:'Most recent order', v:dates[dates.length-1] || '—'},
    {k:'Units owned', v:String(units.length)},
    {k:'Units still under warranty', v:String(units.filter(u=>u.state==='active').length)},
    {k:'Reviews written', v:String(revs.length)},
    {k:'Exported on', v:new Date().toLocaleString('en-IN')},
    {k:'Exported by', v:(Auth.session()||{}).name || 'admin'}
  ];

  const sheets = [
    {name:'Profile',    title:'Customer — ' + (c.name||ownerKey), subtitle:'Summary', cols:profileCols, rows:profile},
    {name:'Orders',     title:'Orders',            subtitle:c.name||ownerKey, cols:WB_COLS.orders,    rows:WB_ROWS.orders(orders)},
    {name:'Items',      title:'Items Purchased',   subtitle:c.name||ownerKey, cols:lineCols,          rows:lines},
    {name:'Warranty',   title:'Serials & Warranty',subtitle:c.name||ownerKey, cols:WB_COLS.units,     rows:WB_ROWS.units(units)},
    {name:'Reviews',    title:'Reviews Written',   subtitle:c.name||ownerKey, cols:WB_COLS.reviews,   rows:WB_ROWS.reviews(revs)}
  ];
  const safe = String(c.name || ownerKey).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'customer';
  dl(safe + '-data-' + new Date().toISOString().slice(0,10) + '.xls',
     buildWorkbook(sheets), 'application/vnd.ms-excel');
  toast('Exported everything for ' + (c.name||ownerKey) + '.', 'good');
  Audit.log('export.customer', c.name || ownerKey, '', orders.length + ' orders, ' + units.length + ' units');
}

/* Export exactly the rows currently showing in the Customers table — so a
   search for "Reddy" then Export gives only those customers, which is what the
   request asked for. */
function exportFilteredCustomers(){
  const rows = currentCustomerRows();
  if(!rows.length) return toast('Nothing to export — no customers match.', 'warn');
  const keys = new Set(rows.map(c => c.ownerKey));
  const orders = Repo.orders.list().filter(r => keys.has(String(r.owner||'').toLowerCase()));
  const invNos = new Set(orders.map(r => String(r.inv.no)));
  const units = soldUnits().filter(u => invNos.has(String(u.invoice)));
  const stamp = new Date().toLocaleString('en-IN');
  const label = cq ? 'Matching "' + cq + '"' : 'All customers';

  dl('customers-' + (cq ? cq.replace(/[^A-Za-z0-9]+/g,'-') + '-' : '') +
     new Date().toISOString().slice(0,10) + '.xls',
     buildWorkbook([
       {name:'Customers', title:'Customers', subtitle:stamp + ' · ' + label, cols:WB_COLS.customers, rows:WB_ROWS.customers(rows)},
       {name:'Orders',    title:'Their Orders', subtitle:label, cols:WB_COLS.orders, rows:WB_ROWS.orders(orders)},
       {name:'Warranty',  title:'Their Serials & Warranty', subtitle:label, cols:WB_COLS.units, rows:WB_ROWS.units(units)}
     ]), 'application/vnd.ms-excel');
  toast(rows.length + ' customer' + (rows.length===1?'':'s') + ' exported with their orders.', 'good');
  Audit.log('export.customersFiltered', label, '', rows.length + ' customers');
}
